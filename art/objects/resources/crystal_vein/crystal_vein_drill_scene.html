<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Жила + бур — постріл по кристалу</title>
<!-- Відкривати з цієї папки: жила береться поруч, бур — з ../../buildings/drill/. -->
<style>
  body { margin: 0; display: flex; height: 100vh; font: 13px system-ui, sans-serif; background: #1e2328; color: #ddd; }
  #view { flex: 1; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100vh; cursor: grab; }
  #panel { width: 320px; padding: 12px 14px; background: #262c33; overflow-y: auto; box-sizing: border-box; }
  details { border-top: 1px solid #39424c; padding: 4px 0; }
  summary { cursor: pointer; color: #8fd3ff; font-weight: 600; padding: 4px 0; }
  label { display: block; margin: 6px 0 1px; }
  label span { float: right; color: #ffd27a; }
  input[type=range] { width: 100%; }
  input[type=color] { width: 100%; height: 24px; border: 0; background: none; }
  button { flex: 1; padding: 7px; margin-top: 6px; background: #3a4450; color: #fff; border: 1px solid #556; border-radius: 4px; cursor: pointer; }
  .row { display: flex; gap: 6px; }
  textarea { width: 100%; height: 140px; margin-top: 8px; background: #161a1e; color: #cfe; border: 1px solid #445; font: 11px monospace; }
  .hint { color: #999; font-size: 12px; }
  #phase { color: #ffd27a; font-weight: bold; }
  #msg { color: #ffb070; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div id="view"><canvas id="c" width="2200" height="1400"></canvas></div>
<div id="panel">
  <div class="hint">Тягни: <b style="color:#ff5cf0">рожевий хрестик</b> — точка удару; бур — його місце.</div>
  <div>Фаза: <span id="phase"></span></div>
  <div class="row"><button id="mPlay">▶ Грати</button><button id="mUp">❚ Піднято</button><button id="mFire">❚ Стріляє</button></div>
  <label>Таймлайн <span id="v_scrub"></span></label><input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
  <div class="row"><button id="reset">Скинути все</button><button id="copy">Скопіювати параметри</button></div>
  <div id="msg"></div>
  <div id="controls"></div>
  <details><summary>Перегляд</summary>
    <label>Колір землі</label><input id="ground" type="color" value="#2a2230">
    <label><input id="markers" type="checkbox" checked> показати точку удару і шарніри</label>
  </details>
  <textarea id="out" readonly></textarea>
</div>
<script>
const SRC = { vein: "crystal_vein.png", veinShadow: "crystal_vein_shadow.png",
              s1: "crystal_shard_1.png", s2: "crystal_shard_2.png", s3: "crystal_shard_3.png",
              body: "../../buildings/drill/drill_body.png", bodyShadow: "../../buildings/drill/drill_body_shadow.png",
              seg1: "../../buildings/drill/drill_arm_1.png", seg2: "../../buildings/drill/drill_arm_2.png", seg3: "../../buildings/drill/drill_arm_3.png" };
// ---- drill rig in drill sprite space (= drill_rig.json)
const SHOULDER_GROUND = { x: 1010, y: 680 }, SHOULDER = { x: 1000, y: 225 };
const SEG1 = { pivot: { x: 615, y: 140 }, end: { x: 300, y: 275 } };
const SEG2 = { pivot: { x: 450, y: 405 }, end: { x: 308, y: 608 } };
const SEG3 = { pivot: { x: 308, y: 608 }, end: { x: 96, y: 932 } };     // lens
const DRILL_BASE_Y = 936;                                               // bottom of the body, for depth sorting
// ---- vein: tuned in crystal_vein_anim.html (its canvas had the vein at 32,80)
const VEIN_OLD = { x: 32, y: 80 };

// [key, group, label, min, max, step, default]
const SPEC = [
  ["vX", "Розміщення", "Моноліт X", -400, 1200, 1, 300], ["vY", "Розміщення", "Моноліт Y", -300, 800, 1, 260],
  ["dX", "Розміщення", "Бур X", -500, 2200, 1, 1180], ["dY", "Розміщення", "Бур Y", -500, 1400, 1, 420],
  ["dS", "Розміщення", "Масштаб бура", 0.2, 1.5, 0.01, 0.5],
  ["hitX", "Розміщення", "Точка удару X", 0, 2200, 1, 1192], ["hitY", "Розміщення", "Точка удару Y", 0, 1400, 1, 840],
  ["autoAim", "Розміщення", "Голова сама цілиться (1 = так)", 0, 1, 1, 1],
  ["u1", "Поза «піднято», °", "Плече", -40, 80, 1, 80], ["u2", "Поза «піднято», °", "Лікоть", -80, 60, 1, -65],
  ["u3", "Поза «піднято», °", "Голова", -80, 80, 1, 9],
  ["f1", "Поза «стріляє», °", "Плече", -40, 80, 1, 53], ["f2", "Поза «стріляє», °", "Лікоть", -80, 60, 1, -67],
  ["f3", "Поза «стріляє», °", "Голова (при авто — поправка до наведення)", -80, 80, 1, 1],
  ["tMove", "Час, с", "Опускання / підйом", 0.1, 3, 0.05, 0.5], ["tCharge", "Час, с", "Заряд лінзи", 0, 3, 0.05, 0.6],
  ["tFire", "Час, с", "Стріляє", 0.2, 8, 0.1, 2.5], ["tCool", "Час, с", "Охолодження", 0, 3, 0.05, 0.5],
  ["tWait", "Час, с", "Чекає вгорі", 0, 6, 0.1, 1], ["recoil", "Час, с", "Тремтіння при пострілі", 0, 3, 0.05, 0.5],
  ["tipX", "Промінь", "Точка виходу: зсув X", -80, 80, 1, 0], ["tipY", "Промінь", "Точка виходу: зсув Y", -80, 80, 1, -7],
  
  ["coreW", "Промінь", "Товщина ядра", 0.5, 20, 0.5, 12.5], ["glowW", "Промінь", "Товщина сяйва", 2, 80, 1, 78],
  ["glowA", "Промінь", "Яскравість сяйва", 0, 1, 0.01, 0.55], ["flickA", "Промінь", "Мерехтіння: сила", 0, 1, 0.01, 0.54],
  ["flickS", "Промінь", "Мерехтіння: швидкість", 0, 60, 0.5, 29], ["startT", "Промінь", "Розгін променя, с", 0, 1, 0.01, 0],
  ["lensR", "Лінза", "Сяйво лінзи, радіус", 0, 120, 1, 66], ["lensA", "Лінза", "Сяйво лінзи, яскравість", 0, 1, 0.01, 1],
  ["hotR", "Точка удару", "Розжарена пляма, радіус", 0, 200, 1, 120], ["hotA", "Точка удару", "Пляма, яскравість", 0, 1, 0.01, 0.72],
  ["hotPulse", "Точка удару", "Пляма, пульсація", 0, 1, 0.01, 0.14],
  ["crystalHeat", "Точка удару", "Кристал розжарюється (сяйво навколо)", 0, 1, 0.01, 0.49],
  ["sRate", "Іскри", "Скільки за кадр", 0, 30, 1, 6], ["sSpeed", "Іскри", "Швидкість", 50, 1500, 10, 660],
  ["sSpread", "Іскри", "Розкид, °", 0, 360, 1, 171], ["sDir", "Іскри", "Напрям (0 = вгору), °", -180, 180, 1, 6],
  ["sGrav", "Іскри", "Гравітація", 0, 3000, 10, 1020], ["sLife", "Іскри", "Життя, с", 0.05, 2, 0.01, 0.72],
  ["sSize", "Іскри", "Розмір", 0.5, 10, 0.1, 4.8], ["sTail", "Іскри", "Довжина хвоста", 0, 0.1, 0.002, 0.042],
  ["sTx", "Тінь руки", "Зсув вліво на 1 px висоти", -2, 0, 0.05, -0.3], ["sTy", "Тінь руки", "Зсув вниз на 1 px висоти", -0.5, 1, 0.05, 0.2],
  ["sK", "Тінь руки", "Товщина тіні", 0.2, 1.5, 0.05, 0.85], ["sOp", "Тінь руки", "Прозорість", 0, 1, 0.05, 0.35],
  ["sBlur", "Тінь руки", "Розмиття, px", 0, 20, 1, 2],
];
const SHARD_DEF = [
  { x: 633, y: 330, amp: 26, period: 3.2, phase: 0, sway: 6, scale: 0.25, height: 260 },
  { x: 1047, y: 281, amp: 20, period: 2.6, phase: 0.33, sway: 9, scale: 0.22, height: 220 },
  { x: 611, y: 795, amp: 30, period: 3.8, phase: 0.66, sway: 4, scale: 0.22, height: 160 },
];
SHARD_DEF.forEach((d, i) => {
  const g = `Кристалик ${i + 1}`, n = i + 1;
  SPEC.push([`x${n}`, g, "Позиція X (у кадрі жили)", 0, 1600, 1, d.x], [`y${n}`, g, "Позиція Y (у кадрі жили)", 0, 1200, 1, d.y],
            [`h${n}`, g, "Висота (для тіні), px", 0, 900, 1, d.height], [`amp${n}`, g, "Амплітуда, px", 0, 150, 1, d.amp],
            [`per${n}`, g, "Період, с", 0.5, 10, 0.1, d.period], [`ph${n}`, g, "Зсув фази", 0, 1, 0.01, d.phase],
            [`sway${n}`, g, "Хитання, °", 0, 45, 0.5, d.sway], [`sc${n}`, g, "Масштаб", 0.05, 1.5, 0.01, d.scale],
            [`spin${n}`, g, "Обертання", 0, 1, 0.01, 0]);
});
SPEC.push(
  ["glowR", "Сяйво жили", "Кристалики: радіус", 0, 300, 1, 83], ["kGlowA", "Сяйво жили", "Кристалики: яскравість", 0, 1, 0.01, 0.55],
  ["glowPulse", "Сяйво жили", "Кристалики: пульсація", 0, 1, 0.01, 0.51],
  ["mGlowR", "Сяйво жили", "Моноліт: радіус", 0, 700, 1, 432], ["mGlowA", "Сяйво жили", "Моноліт: яскравість", 0, 1, 0.01, 0.18],
  ["mGlowX", "Сяйво жили", "Моноліт: центр X", 0, 1600, 1, 832], ["mGlowY", "Сяйво жили", "Моноліт: центр Y", 0, 1200, 1, 549],
  ["mPulseS", "Сяйво жили", "Моноліт: швидкість пульсу", 0, 5, 0.05, 0.6],
  ["shA", "Сяйво жили", "Тінь кристаликів: прозорість", 0, 1, 0.01, 0.28], ["shR", "Сяйво жили", "Тінь кристаликів: розмір", 5, 200, 1, 48],
  ["shDx", "Сяйво жили", "Тінь кристаликів: зсув на 1 px висоти", -1.5, 0.5, 0.01, -0.3],
  ["shShrink", "Сяйво жили", "Тінь кристаликів: меншає з висотою", 0, 1, 0.01, 0.45],
);
const COLORS = [["cBeam", "Промінь", "Колір сяйва", "#ff2a2a"], ["cCore", "Промінь", "Колір ядра", "#fff1e6"],
                ["cHot", "Точка удару", "Колір плями", "#ff7a2a"], ["cSpark", "Іскри", "Колір іскор", "#ff5030"],
                ["cGlow", "Сяйво жили", "Колір кристаликів", "#4fb6ff"], ["cMGlow", "Сяйво жили", "Колір моноліту", "#3d8cff"]];
const P = {};
for (const s of SPEC) P[s[0]] = s[6];
for (const c of COLORS) P[c[0]] = c[3];
const DEFAULTS = { ...P };

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const img = {}; let loaded = 0; const NIMG = Object.keys(SRC).length;
for (const k in SRC) {
  img[k] = new Image();
  img[k].onload = () => { if (++loaded === NIMG) start(); };
  img[k].onerror = () => { document.getElementById("msg").textContent = "Не знайдено " + SRC[k] + " — відкрий сторінку з цієї папки."; };
  img[k].src = SRC[k];
}

const rad = d => d * Math.PI / 180;
const rot = (v, a) => ({ x: v.x * Math.cos(a) - v.y * Math.sin(a), y: v.x * Math.sin(a) + v.y * Math.cos(a) });
const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const len = v => Math.hypot(v.x, v.y);
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(",");
function glow(x, y, r, rgb, a) {
  if (r <= 0 || a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
// drill sprite space <-> world
const toW = p => ({ x: P.dX + p.x * P.dS, y: P.dY + p.y * P.dS });
const toD = p => ({ x: (p.x - P.dX) / P.dS, y: (p.y - P.dY) / P.dS });
// vein old-canvas coords -> world
const vW = (x, y) => ({ x: P.vX + x - VEIN_OLD.x, y: P.vY + y - VEIN_OLD.y });

// ---- drill rig
const L1 = len(sub(SEG1.end, SEG1.pivot)), L2 = len(sub(SEG2.end, SEG2.pivot)), L3 = len(sub(SEG3.end, SEG3.pivot));
const FRAC = [0, L1 / (L1 + L2 + L3), (L1 + L2) / (L1 + L2 + L3), 1];
const HEAD_BASE = Math.atan2(SEG3.end.y - SEG3.pivot.y, SEG3.end.x - SEG3.pivot.x);
function rig(a1, a2, a3) {
  const s = SHOULDER;
  const elbow = add(s, rot(sub(SEG1.end, SEG1.pivot), a1));
  const wrist = add(elbow, rot(sub(SEG2.end, SEG2.pivot), a1 + a2));
  const tip = add(wrist, rot(sub(SEG3.end, SEG3.pivot), a1 + a2 + a3));
  return { s, elbow, wrist, tip, A1: a1, A2: a1 + a2, A3: a1 + a2 + a3 };
}
// head angle (relative) that points the barrel at the hit point, for given shoulder/elbow
function aimHead(a1, a2) {
  const r = rig(a1, a2, 0), hit = toD({ x: P.hitX, y: P.hitY });
  const want = Math.atan2(hit.y - r.wrist.y, hit.x - r.wrist.x);
  return want - HEAD_BASE - (a1 + a2);
}
function segShadowMatrix(Pj, Qj, Ps, Qs) {
  const u0 = sub(Qj, Pj), lu = len(u0), u = { x: u0.x / lu, y: u0.y / lu }, n = { x: -u.y, y: u.x };
  const v0 = sub(Qs, Ps), lv = len(v0), v = { x: v0.x / lv, y: v0.y / lv }, m = { x: -v.y, y: v.x };
  const s = lv / lu, k = P.sK;
  const a = s * v.x * u.x + k * m.x * n.x, b = s * v.x * u.y + k * m.x * n.y;
  const c = s * v.y * u.x + k * m.y * n.x, d = s * v.y * u.y + k * m.y * n.y;
  return [a, c, b, d, Ps.x - (a * Pj.x + b * Pj.y), Ps.y - (c * Pj.x + d * Pj.y)];
}
const dark = {};
function makeDark() {
  for (const k of ["seg1", "seg2", "seg3"]) {
    const c = document.createElement("canvas"); c.width = img[k].width; c.height = img[k].height;
    const g = c.getContext("2d"); g.drawImage(img[k], 0, 0);
    g.globalCompositeOperation = "source-in"; g.fillStyle = "rgb(3,11,26)"; g.fillRect(0, 0, c.width, c.height);
    dark[k] = c;
  }
}
const shadowCv = document.createElement("canvas"); shadowCv.width = 1800; shadowCv.height = 1250;

// ---- phases
const PHASES = () => [["опускає", P.tMove], ["заряд", P.tCharge], ["стріляє", P.tFire], ["охолодження", P.tCool], ["піднімає", P.tMove], ["чекає", P.tWait]];
const cycleLen = () => PHASES().reduce((s, x) => s + x[1], 0) || 1;
function phaseAt(t) {
  let k = t % cycleLen();
  for (const [name, d] of PHASES()) { if (k < d) return { name, k: d ? k / d : 1, el: k }; k -= d; }
  return { name: "чекає", k: 1, el: 0 };
}
let mode = "play", scrubT = 0, t0 = performance.now(), last = t0;
function setMode(m) {
  mode = m;
  for (const [id, mm] of [["mPlay", "play"], ["mUp", "up"], ["mFire", "fire"]])
    document.getElementById(id).style.background = mm === mode ? "#5a6b2a" : "#3a4450";
  if (m === "play") t0 = performance.now() - scrubT * 1000;
}

// ---- sparks (world space)
const sparks = [];
function spawnSparks(at, power) {
  const n = Math.round(P.sRate * power);
  for (let i = 0; i < n; i++) {
    const ang = rad(-90 + P.sDir + (Math.random() - 0.5) * P.sSpread), sp = P.sSpeed * (0.35 + Math.random() * 0.65);
    sparks.push({ x: at.x, y: at.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, age: 0, life: P.sLife * (0.5 + Math.random()) });
  }
}
function stepSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.age += dt; if (p.age > p.life) { sparks.splice(i, 1); continue; }
    p.vy += P.sGrav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function shardState(n, t) {
  const per = P["per" + n], ph = P["ph" + n], s = Math.sin((t / per + ph) * Math.PI * 2);
  const w = vW(P["x" + n], P["y" + n] - s * P["amp" + n]);
  return { x: w.x, y: w.y, lift: s, rot: rad(P["sway" + n]) * Math.sin((t / (per * 1.7) + ph) * Math.PI * 2),
           sx: 1 - P["spin" + n] * (0.5 - 0.5 * Math.cos((t / (per * 1.3) + ph) * Math.PI * 2)) };
}

function drawVein(t) {
  const o = vW(VEIN_OLD.x, VEIN_OLD.y);
  for (let n = 1; n <= 3; n++) {                         // shard shadows on the rocks
    const st = shardState(n, t), h = P["h" + n] + st.lift * P["amp" + n], k = Math.max(0.15, 1 - P.shShrink * h / 900), sc = P["sc" + n] / 0.3;
    ctx.fillStyle = `rgba(3,11,26,${P.shA * k})`;
    ctx.beginPath(); ctx.ellipse(st.x + P.shDx * h, st.y + h, P.shR * k * sc, P.shR * 0.35 * k * sc, 0, 0, 7); ctx.fill();
  }
  ctx.drawImage(img.vein, o.x, o.y);
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const g = vW(P.mGlowX, P.mGlowY);
  glow(g.x, g.y, P.mGlowR, hexRgb(P.cMGlow), P.mGlowA * (0.75 + 0.25 * Math.sin(t * P.mPulseS * Math.PI * 2)));
  ctx.restore();
  for (let n = 1; n <= 3; n++) {
    const st = shardState(n, t), im = img["s" + n], sc = P["sc" + n];
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    glow(st.x, st.y, P.glowR * sc / 0.3, hexRgb(P.cGlow), P.kGlowA * (1 - P.glowPulse * 0.5 + P.glowPulse * 0.5 * st.lift));
    ctx.restore();
    ctx.save(); ctx.translate(st.x, st.y); ctx.rotate(st.rot); ctx.scale(sc * st.sx, sc); ctx.drawImage(im, -im.width / 2, -im.height / 2); ctx.restore();
  }
}

function drawDrill(R, jx, jy) {                          // R in drill space; ctx already in drill space
  ctx.save(); ctx.translate(jx * 0.3, jy * 0.3); ctx.drawImage(img.body, 0, 0); ctx.restore();
  ctx.save(); ctx.translate(jx, jy);
  for (const [im, part, at, ang] of [[img.seg3, SEG3, R.wrist, R.A3], [img.seg2, SEG2, R.elbow, R.A2], [img.seg1, SEG1, R.s, R.A1]]) {
    ctx.save(); ctx.translate(at.x, at.y); ctx.rotate(ang); ctx.drawImage(im, -part.pivot.x, -part.pivot.y); ctx.restore();
  }
  ctx.restore();
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let ph, t = (now - t0) / 1000;
  if (mode === "up") ph = { name: "чекає", k: 1, el: 0 };
  else if (mode === "fire") ph = { name: "стріляє", k: 0.5, el: 99 };
  else {
    if (mode === "play") { scrubT = t % cycleLen(); document.getElementById("scrub").value = scrubT / cycleLen(); } else t = scrubT;
    document.getElementById("v_scrub").textContent = scrubT.toFixed(2) + " с";
    ph = phaseAt(mode === "play" ? t : scrubT);
  }
  const fireHead = (P.autoAim ? aimHead(rad(P.f1), rad(P.f2)) : 0) + rad(P.f3);
  const up = [rad(P.u1), rad(P.u2), rad(P.u3)], fr = [rad(P.f1), rad(P.f2), fireHead];
  let m = 0;
  if (ph.name === "опускає") m = ease(ph.k); else if (ph.name === "піднімає") m = 1 - ease(ph.k);
  else if (ph.name === "заряд" || ph.name === "стріляє" || ph.name === "охолодження") m = 1;
  const a = up.map((u, i) => lerp(u, fr[i], m));
  let charge = 0, beamOn = 0;
  if (ph.name === "заряд") charge = ph.k;
  else if (ph.name === "стріляє") { charge = 1; beamOn = P.startT > 0 ? Math.min(1, ph.el / P.startT) : 1; }
  else if (ph.name === "охолодження") charge = 1 - ph.k;
  let jx = 0, jy = 0;
  if (ph.name === "стріляє") { a[2] += rad(Math.sin(now * 0.08) * 0.6 * P.recoil); jx = Math.sin(now * 0.11) * 1.2 * P.recoil; jy = Math.cos(now * 0.13) * 0.8 * P.recoil; }
  const R = rig(a[0], a[1], a[2]);
  const Td = add(add(R.tip, rot({ x: P.tipX, y: P.tipY }, R.A3)), { x: jx, y: jy });
  const T = toW(Td), H = { x: P.hitX, y: P.hitY };
  const flick = 1 + P.flickA * (Math.sin(now * 0.001 * P.flickS * 6.3) * 0.6 + (Math.random() - 0.5) * 0.8);
  if (beamOn > 0.5) spawnSparks(H, beamOn); stepSparks(dt);

  // ---- ground and shadows
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = document.getElementById("ground").value; ctx.fillRect(0, 0, cv.width, cv.height);
  const o = vW(VEIN_OLD.x, VEIN_OLD.y);
  ctx.drawImage(img.veinShadow, o.x, o.y);
  ctx.save(); ctx.setTransform(P.dS, 0, 0, P.dS, P.dX, P.dY); ctx.drawImage(img.bodyShadow, 0, 0); ctx.restore();
  // arm shadow (drill space)
  const Rf = rig(fr[0], fr[1], fr[2]), J = [R.s, R.elbow, R.wrist, R.tip];
  const SP = J.map((j, i) => { const gy = SHOULDER_GROUND.y + FRAC[i] * (Rf.tip.y - SHOULDER_GROUND.y), h = gy - j.y; return { x: j.x + P.sTx * h, y: gy + P.sTy * h }; });
  const sg = shadowCv.getContext("2d");
  sg.setTransform(1, 0, 0, 1, 0, 0); sg.clearRect(0, 0, shadowCv.width, shadowCv.height);
  for (const [i, k, part, at, ang] of [[2, "seg3", SEG3, R.wrist, R.A3], [1, "seg2", SEG2, R.elbow, R.A2], [0, "seg1", SEG1, R.s, R.A1]]) {
    sg.setTransform(...segShadowMatrix(J[i], J[i + 1], SP[i], SP[i + 1]));
    sg.translate(at.x, at.y); sg.rotate(ang); sg.drawImage(dark[k], -part.pivot.x, -part.pivot.y);
  }
  ctx.save(); ctx.globalAlpha = P.sOp; if (P.sBlur) ctx.filter = `blur(${P.sBlur * P.dS}px)`;
  ctx.setTransform(P.dS, 0, 0, P.dS, P.dX, P.dY); ctx.drawImage(shadowCv, 0, 0); ctx.restore();

  // ---- objects sorted by their base line (Y-sort)
  const veinBase = o.y + 980, drillBase = P.dY + DRILL_BASE_Y * P.dS;
  const drawD = () => { ctx.save(); ctx.setTransform(P.dS, 0, 0, P.dS, P.dX, P.dY); drawDrill(R, jx, jy); ctx.restore(); };
  if (drillBase < veinBase) { drawD(); drawVein(t); } else { drawVein(t); drawD(); }

  // ---- laser effects on top
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  if (beamOn > 0) {
    const pulse = 1 + P.hotPulse * Math.sin(now * 0.02);
    glow(H.x, H.y, P.hotR * 3 * pulse * beamOn, hexRgb(P.cHot), P.crystalHeat * 0.5 * beamOn);
    glow(H.x, H.y, P.hotR * pulse * beamOn, hexRgb(P.cHot), P.hotA * beamOn);
    glow(H.x, H.y, P.hotR * 0.35 * pulse * beamOn, hexRgb(P.cCore), P.hotA * beamOn);
    ctx.lineCap = "round";
    const Hb = { x: lerp(T.x, H.x, beamOn), y: lerp(T.y, H.y, beamOn) }, rgb = hexRgb(P.cBeam), core = hexRgb(P.cCore);
    for (const [w, al, c] of [[P.glowW, P.glowA * 0.45, rgb], [P.glowW * 0.45, P.glowA, rgb], [P.coreW, 1, core]]) {
      ctx.strokeStyle = `rgba(${c},${al})`; ctx.lineWidth = Math.max(0.5, w * flick * P.dS);
      ctx.beginPath(); ctx.moveTo(T.x, T.y); ctx.lineTo(Hb.x, Hb.y); ctx.stroke();
    }
  }
  if (charge > 0) {
    glow(T.x, T.y, P.lensR * P.dS * charge * (beamOn ? flick : 1), hexRgb(P.cBeam), P.lensA * charge);
    glow(T.x, T.y, P.lensR * 0.3 * P.dS * charge, hexRgb(P.cCore), P.lensA * charge);
  }
  const srgb = hexRgb(P.cSpark);
  for (const p of sparks) {
    const al = 1 - p.age / p.life;
    ctx.strokeStyle = `rgba(${srgb},${al})`; ctx.lineWidth = P.sSize * (0.6 + al * 0.6);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * P.sTail, p.y - p.vy * P.sTail); ctx.stroke();
  }
  ctx.restore();

  if (document.getElementById("markers").checked) {
    ctx.strokeStyle = "#ff5cf0"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(H.x - 18, H.y); ctx.lineTo(H.x + 18, H.y); ctx.moveTo(H.x, H.y - 18); ctx.lineTo(H.x, H.y + 18); ctx.stroke();
    ctx.fillStyle = "#ff0"; for (const p of [R.s, R.elbow, R.wrist]) { const w = toW(p); ctx.beginPath(); ctx.arc(w.x, w.y, 6, 0, 7); ctx.fill(); }
    ctx.fillStyle = "#0ff"; ctx.beginPath(); ctx.arc(T.x, T.y, 6, 0, 7); ctx.fill();
  }
  document.getElementById("phase").textContent = ph.name;
  requestAnimationFrame(frame);
}

function buildUI() {
  const root = document.getElementById("controls"); const groups = {};
  const group = name => {
    if (!groups[name]) { const d = document.createElement("details"); d.open = name === "Розміщення" || name.startsWith("Поза «стріляє»");
      const s = document.createElement("summary"); s.textContent = name; d.appendChild(s); root.appendChild(d); groups[name] = d; }
    return groups[name];
  };
  for (const [k, g, label, min, max, step] of SPEC) {
    const L = document.createElement("label"); L.innerHTML = `${label} <span id="v_${k}"></span>`;
    const I = document.createElement("input"); I.type = "range"; I.min = min; I.max = max; I.step = step; I.id = k; I.value = P[k];
    I.addEventListener("input", e => {
      P[k] = +e.target.value; refresh();
      if (/^u\d$/.test(k)) setMode("up");
      else if (/^f\d$/.test(k) || ["Промінь", "Лінза", "Точка удару", "Іскри"].includes(g) || ["hitX", "hitY", "autoAim"].includes(k)) setMode("fire");
    });
    group(g).appendChild(L); group(g).appendChild(I);
  }
  for (const [k, g, label] of COLORS) {
    const L = document.createElement("label"); L.textContent = label;
    const I = document.createElement("input"); I.type = "color"; I.id = k; I.value = P[k];
    I.addEventListener("input", e => { P[k] = e.target.value; refresh(); });
    group(g).appendChild(L); group(g).appendChild(I);
  }
  refresh();
}
function refresh() {
  for (const [k, , , , , step] of SPEC) {
    document.getElementById(k).value = P[k];
    document.getElementById("v_" + k).textContent = (+P[k]).toFixed(step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3);
  }
  for (const [k] of COLORS) document.getElementById(k).value = P[k];
  document.getElementById("out").value = JSON.stringify(P, null, 1);
}

function start() {
  buildUI(); makeDark();
  document.getElementById("mPlay").onclick = () => setMode("play");
  document.getElementById("mUp").onclick = () => setMode("up");
  document.getElementById("mFire").onclick = () => setMode("fire");
  document.getElementById("scrub").addEventListener("input", e => { scrubT = +e.target.value * cycleLen(); setMode("scrub"); });
  document.getElementById("reset").onclick = () => { Object.assign(P, DEFAULTS); refresh(); };
  document.getElementById("copy").onclick = () => {
    const t = document.getElementById("out"); t.select(); navigator.clipboard?.writeText(t.value); document.execCommand("copy");
  };
  // drag: hit marker (within 40 px) or the drill body
  let drag = null;
  const toCanvas = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
  cv.addEventListener("mousedown", e => {
    const m = toCanvas(e);
    if (Math.hypot(m.x - P.hitX, m.y - P.hitY) < 40) { drag = { what: "hit", m, x: P.hitX, y: P.hitY }; setMode("fire"); return; }
    const d = toD(m);
    if (d.x > 600 && d.x < 1560 && d.y > 160 && d.y < 940) drag = { what: "drill", m, x: P.dX, y: P.dY };
  });
  window.addEventListener("mousemove", e => {
    if (!drag) return; const m = toCanvas(e), dx = Math.round(m.x - drag.m.x), dy = Math.round(m.y - drag.m.y);
    if (drag.what === "hit") { P.hitX = drag.x + dx; P.hitY = drag.y + dy; } else { P.dX = drag.x + dx; P.dY = drag.y + dy; }
    refresh();
  });
  window.addEventListener("mouseup", () => { drag = null; });
  setMode("play");
  requestAnimationFrame(frame);
}
</script>
