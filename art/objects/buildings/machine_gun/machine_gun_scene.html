<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Пушки — кулемет і гранатомет (8 ракурсів)</title>
<!-- Відкривати з цієї папки. Перевірка через URL: ?t=2&tx=1800&ty=700&mg=snap|turn|blend&mo=tilt|views -->
<style>
  body { margin: 0; display: flex; height: 100vh; font: 13px system-ui, sans-serif; background: #1e2328; color: #ddd; }
  #view { flex: 1; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100vh; cursor: crosshair; }
  #panel { width: 320px; padding: 12px 14px; background: #262c33; overflow-y: auto; box-sizing: border-box; }
  details { border-top: 1px solid #39424c; padding: 4px 0; }
  summary { cursor: pointer; color: #8fd3ff; font-weight: 600; padding: 4px 0; }
  label { display: block; margin: 6px 0 1px; }
  label span { float: right; color: #ffd27a; }
  input[type=range] { width: 100%; }
  select { width: 100%; padding: 4px; background: #161a1e; color: #ddd; border: 1px solid #445; }
  button { flex: 1; padding: 7px; margin-top: 6px; background: #3a4450; color: #fff; border: 1px solid #556; border-radius: 4px; cursor: pointer; }
  .row { display: flex; gap: 6px; }
  textarea { width: 100%; height: 140px; margin-top: 8px; background: #161a1e; color: #cfe; border: 1px solid #445; font: 11px monospace; }
  .hint { color: #999; font-size: 12px; }
  #msg { color: #ffb070; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div id="view"><canvas id="c" width="2000" height="1200"></canvas></div>
<div id="panel">
  <div class="hint">Клік / тягни по полю — ставиш ціль. «Ціль рухається» — знову по колу.</div>
  <div class="row"><button id="play">Пауза</button><button id="move">Ціль рухається</button></div>
  <label>Кулемет: як повертається</label>
  <select id="mgMode"><option value="snap" selected>8 ракурсів, ривками</option><option value="turn">8 ракурсів + доворот спрайта</option><option value="blend">8 ракурсів, перетікання</option></select>
  <label>Гранатомет: як повертається</label>
  <select id="moMode"><option value="tilt">Нахил труби вліво-вправо (2D)</option><option value="views" selected>8 ракурсів</option></select>
  <div class="row"><button id="reset">Скинути все</button><button id="copy">Скопіювати параметри</button></div>
  <div id="msg"></div>
  <div id="controls"></div>
  <details><summary>Перегляд</summary><label><input id="markers" type="checkbox"> дуло, кільце, дальність</label></details>
  <textarea id="out" readonly></textarea>
</div>
<script>
// ---------- rig (pixel coords inside each 418x418 PNG)
const VIEWS = [0, 45, 90, 135, 180, 225, 270, 315];      // ground angle of each view: 0 = right, 90 = toward camera
// heads[a] = [housing x, housing y, muzzle x, muzzle y]
const MG = { base: "machine_gun_base.png", baseShadow: "machine_gun_base_shadow.png", ring: { x: 212, y: 157 }, ringH: 150,
  heads: { 0: [120, 189, 361, 194], 45: [110, 142, 338, 263], 90: [212, 137, 207, 316], 135: [309, 143, 80, 263],
           180: [297, 189, 56, 195], 225: [294, 245, 86, 142], 270: [206, 244, 212, 101], 315: [128, 249, 335, 145] } };
const MO = { base: "../grenade_launcher/grenade_launcher_base.png", baseShadow: "../grenade_launcher/grenade_launcher_base_shadow.png", ring: { x: 215, y: 190 }, ringH: 140,
  heads: { 0: [212, 226, 348, 52], 45: [194, 237, 310, 66], 90: [216, 241, 211, 56], 135: [224, 237, 107, 66],
           180: [206, 225, 69, 52], 225: [207, 236, 122, 50], 270: [214, 233, 211, 44], 315: [210, 236, 295, 48] },
  tilt: { cradle: "../grenade_launcher/grenade_launcher_tilt_cradle.png", outer: "../grenade_launcher/grenade_launcher_tube_outer.png", shaft: "../grenade_launcher/grenade_launcher_tube_shaft.png", cap: "../grenade_launcher/grenade_launcher_tube_cap.png",
          housing: { x: 214, y: 233 }, pivot: { x: 214, y: 150 }, outerTop: 92, shaftRows: [56, 92], capRows: [22, 56], muzzleInCap: 10 } };

const SPEC = [
  ["camK", "Сцена", "Сплющення землі (камера)", 0.2, 1, 0.01, 0.75],
  ["sunX", "Сцена", "Тінь: зсув X на 1 px висоти", -1.5, 0.5, 0.01, -0.13],
  ["sunY", "Сцена", "Тінь: зсув Y на 1 px висоти", -0.5, 1, 0.01, -0.2],
  ["tSpeed", "Ціль", "Швидкість руху цілі", 0, 2, 0.01, 0.67],
  ["tRx", "Ціль", "Радіус руху X", 0, 900, 1, 900], ["tRy", "Ціль", "Радіус руху Y", 0, 500, 1, 330],
  ["tCx", "Ціль", "Центр руху X", 0, 2000, 1, 1691], ["tCy", "Ціль", "Центр руху Y", 0, 1200, 1, 650],
];
function turretSpec(p, g, d) {
  SPEC.push([p + "X", g, "Позиція X", 0, 2000, 1, d.x], [p + "Y", g, "Позиція Y (земля)", 0, 1200, 1, d.y],
    [p + "S", g, "Масштаб пушки", 0.2, 2, 0.01, d.s], [p + "HS", g, "Масштаб голови", 0.3, 1.6, 0.01, d.hs],
    [p + "Lift", g, "Голова над кільцем, px", -100, 250, 1, d.lift],
    [p + "Rot", g, "Швидкість повороту, °/с", 10, 720, 1, d.rot], [p + "Tol", g, "Стріляє, коли ціль у межах, °", 1, 45, 1, d.tol],
    [p + "Range", g, "Дальність, px", 100, 2000, 10, d.range], [p + "Rate", g, "Пострілів за секунду", 0.2, 30, 0.1, d.rate],
    [p + "Rec", g, "Віддача, px", 0, 60, 1, d.rec], [p + "RecT", g, "Повернення після віддачі, с", 0.02, 1, 0.01, d.recT],
    [p + "Flash", g, "Спалах: розмір", 0, 200, 1, d.flash], [p + "ShA", g, "Тінь голови: прозорість", 0, 1, 0.01, 0.35],
    [p + "Turn", g, "Доворот спрайта: сила (0–1)", 0, 1, 0.01, d.turn],
    [p + "HX", g, "Голова: зсув X, px", -150, 150, 1, 0],
    [p + "BShA", g, "Тінь основи: прозорість", 0, 1.5, 0.01, 1],
    [p + "ShDrop", g, "Тінь голови: наскільки опущена (0–1.5)", 0, 1.5, 0.01, 0.92]);
  for (const a of VIEWS) SPEC.push([`${p}Ox${a}`, g + ": ракурси", `${a}° — зсув X`, -120, 120, 1, 0], [`${p}Oy${a}`, g + ": ракурси", `${a}° — зсув Y`, -120, 120, 1, 0]);
}
turretSpec("mg", "Кулемет", { x: 626, y: 700, s: 0.87, hs: 0.77, lift: 87, rot: 275, tol: 8, range: 1310, rate: 12, rec: 5, recT: 0.05, flash: 60, turn: 0.41 });
SPEC.push(["mgTrSp", "Кулемет", "Трасер: швидкість", 500, 8000, 50, 3200], ["mgTrL", "Кулемет", "Трасер: довжина", 5, 300, 1, 80],
          ["mgTrW", "Кулемет", "Трасер: товщина", 1, 12, 0.5, 4], ["mgCas", "Кулемет", "Гільзи (1 = так)", 0, 1, 1, 1],
          ["mgSpread", "Кулемет", "Розкид куль, px", 0, 120, 1, 22]);
turretSpec("mo", "Гранатомет", { x: 1380, y: 760, s: 0.9, hs: 0.85, lift: 80, rot: 120, tol: 5, range: 1800, rate: 0.7, rec: 18, recT: 0.3, flash: 80, turn: 0 });
SPEC.push(["moExt", "Гранатомет: труба", "Висув верхньої частини (довжина), px", 0, 300, 1, 70],
          ["moInW", "Гранатомет: труба", "Ширина верхньої частини", 0.5, 1.1, 0.01, 0.84],
          ["moRetD", "Гранатомет: труба", "При пострілі в'їжджає на, px", 0, 300, 1, 80],
          ["moRetT", "Гранатомет: труба", "В'їзд, с", 0.01, 0.5, 0.01, 0.05],
          ["moExtT", "Гранатомет: труба", "Розкладання назад, с", 0.05, 2, 0.01, 0.45],
          ["moOuterS", "Гранатомет: труба", "Масштаб гільзи по довжині", 0.5, 2, 0.01, 1],
          ["moPivY", "Гранатомет: труба", "Шарнір нахилу: зсув Y, px", -100, 100, 1, 0],
          ["moTiltMax", "Гранатомет", "Нахил: максимум, °", 5, 80, 1, 50], ["moTiltR", "Гранатомет", "Нахил: дистанція до максимуму, px", 100, 2000, 10, 900],
          ["moFlight", "Гранатомет", "Час польоту, с", 0.3, 4, 0.05, 1.3], ["moArc", "Гранатомет", "Висота дуги, px", 50, 1400, 10, 600],
          ["moBlast", "Гранатомет", "Радіус вибуху, px", 20, 400, 1, 150], ["moShell", "Гранатомет", "Розмір снаряда", 2, 40, 1, 12]);
const P = {}; for (const s of SPEC) P[s[0]] = s[6]; const DEFAULTS = { ...P };

const Q = new URLSearchParams(typeof location !== "undefined" ? location.search : "");
const FIXED_T = Q.has("t") ? +Q.get("t") : null;
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI, wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const img = {}; let loaded = 0, need = 0;
function load(key, src) { need++; const im = new Image(); img[key] = im; im.onload = () => { if (++loaded === need) start(); };
  im.onerror = () => { document.getElementById("msg").textContent = "Не знайдено " + src; }; im.src = src; }
const HEAD = { mg: "machine_gun_head_", mo: "../grenade_launcher/grenade_launcher_head_" };
for (const [k, R] of [["mg", MG], ["mo", MO]]) {
  load(k + "_base", R.base); load(k + "_baseShadow", R.baseShadow);
  for (const a of VIEWS) load(`${k}_h${a}`, `${HEAD[k]}${String(a).padStart(3, "0")}.png`);
}
load("mo_cradle", MO.tilt.cradle); load("mo_outer", MO.tilt.outer); load("mo_shaft", MO.tilt.shaft); load("mo_cap", MO.tilt.cap);
const off = document.createElement("canvas"); off.width = cv.width; off.height = cv.height;

const S = { time: 0, target: { x: 1000, y: 650 }, moving: !Q.has("tx"),
  tur: { mg: { ang: rad(90), cd: 0, rec: 0, flash: 0 }, mo: { ang: rad(90), tilt: 0, cd: 0, rec: 0, flash: 0, shot: 99 } },
  tracers: [], casings: [], shells: [], blasts: [], sparks: [] };
if (Q.has("tx")) S.target = { x: +Q.get("tx"), y: +Q.get("ty") };
const mode = { mg: Q.get("mg") || "snap", mo: Q.get("mo") || "views" };

// screen direction of a ground angle (after camera squash)
const scrAng = a => Math.atan2(Math.sin(a) * P.camK, Math.cos(a));
function geo(k) {
  const R = k === "mg" ? MG : MO, s = P[k + "S"];
  const ringW = { x: P[k + "X"], y: P[k + "Y"] - R.ringH * s };        // ring on screen; (X, Y) = ground under it
  return { R, s, ringW, ground: { x: P[k + "X"], y: P[k + "Y"] }, headH: R.ringH * s + P[k + "Lift"] * s * P[k + "HS"] };
}
// which sprite(s) to draw for a ground angle, and how much to rotate them on screen
function pickViews(k, ang) {
  const a = ((deg(ang) % 360) + 360) % 360, i0 = Math.floor(a / 45) % 8, i1 = (i0 + 1) % 8, f = (a - i0 * 45) / 45;
  const near = f < 0.5 ? i0 : i1, m = k === "mg" ? mode.mg : "snap";   // mortar: never rotate the sprite on screen
  const turnBy = v => P[k + "Turn"] * wrap(scrAng(ang) - scrAng(rad(VIEWS[v])));
  if (m === "snap") return [{ v: near, w: 1, rot: 0 }];
  if (m === "turn") return [{ v: near, w: 1, rot: turnBy(near) }];
  return [{ v: i0, w: 1 - f, rot: 0 }, { v: i1, w: f, rot: 0 }];       // blend
}
// head sprite placement: housing point goes above the ring
function headPlace(k, g, view, rot, recoil) {
  const R = g.R, h = R.heads[VIEWS[view]], hs = g.s * P[k + "HS"];
  const back = { x: -Math.cos(scrAng(S.tur[k].ang)) * recoil, y: -Math.sin(scrAng(S.tur[k].ang)) * recoil };
  const a = VIEWS[view];
  const at = { x: g.ringW.x + back.x + (P[k + "HX"] + P[`${k}Ox${a}`]) * hs, y: g.ringW.y - P[k + "Lift"] * hs + back.y + P[`${k}Oy${a}`] * hs };
  const mz = { x: (h[2] - h[0]) * hs, y: (h[3] - h[1]) * hs };
  const c = Math.cos(rot), sn = Math.sin(rot);
  return { at, hs, hx: h[0], hy: h[1], rot, muzzle: { x: at.x + mz.x * c - mz.y * sn, y: at.y + mz.x * sn + mz.y * c } };
}
function retraction(st) {                       // how deep the inner tube is pushed in (sprite px)
  const t = st.shot;
  if (t < P.moRetT) return P.moRetD * t / P.moRetT;
  return P.moRetD * Math.max(0, 1 - (t - P.moRetT) / P.moExtT);
}
function tiltPlace(g) {
  const T = MO.tilt, hs = g.s * P.moHS, st = S.tur.mo;
  const at = { x: g.ringW.x + P.moHX * hs, y: g.ringW.y - P.moLift * hs };
  const piv = { x: at.x + (T.pivot.x - T.housing.x) * hs, y: at.y + (T.pivot.y - T.housing.y + P.moPivY) * hs };
  // along the tube (sprite px above the pivot): outer sleeve, then the stretched shaft, then the cap
  const outerLen = (T.pivot.y - T.outerTop) * P.moOuterS;
  const shaftLen = Math.max(4, (T.shaftRows[1] - T.shaftRows[0]) + P.moExt - retraction(st));
  const capLen = T.capRows[1] - T.capRows[0];
  const muzzleD = outerLen + shaftLen + capLen - T.muzzleInCap;       // pivot -> muzzle
  const len = muzzleD * hs;
  return { at, hs, piv, outerLen, shaftLen, capLen, muzzle: { x: piv.x + Math.sin(st.tilt) * len, y: piv.y - Math.cos(st.tilt) * len } };
}
function muzzleOf(k, g) {
  const st = S.tur[k];
  if (k === "mo" && mode.mo === "tilt") return tiltPlace(g).muzzle;
  let x = 0, y = 0;
  for (const p of pickViews(k, st.ang)) { const hp = headPlace(k, g, p.v, p.rot, st.rec); x += hp.muzzle.x * p.w; y += hp.muzzle.y * p.w; }
  return { x, y };
}

function step(dt) {
  S.time += dt;
  if (S.moving) { const a = S.time * P.tSpeed; S.target = { x: P.tCx + Math.cos(a) * P.tRx, y: P.tCy + Math.sin(a) * P.tRy }; }
  for (const k of ["mg", "mo"]) {
    const g = geo(k), st = S.tur[k];
    const dx = S.target.x - g.ground.x, dy = (S.target.y - g.ground.y) / P.camK, dist = Math.hypot(S.target.x - g.ground.x, S.target.y - g.ground.y);
    let aligned;
    if (k === "mo" && mode.mo === "tilt") {
      const want = rad(P.moTiltMax) * Math.max(-1, Math.min(1, (S.target.x - g.ground.x) / P.moTiltR));
      const d = want - st.tilt, m = rad(P.moRot) * dt; st.tilt += Math.max(-m, Math.min(m, d));
      aligned = Math.abs(want - st.tilt) < rad(P.moTol) && dist < P.moRange;
    } else {
      const want = Math.atan2(dy, dx), diff = wrap(want - st.ang), m = rad(P[k + "Rot"]) * dt;
      st.ang = wrap(st.ang + Math.max(-m, Math.min(m, diff)));
      aligned = Math.abs(wrap(want - st.ang)) < rad(P[k + "Tol"]) && dist < P[k + "Range"];
    }
    st.rec = Math.max(0, st.rec - P[k + "Rec"] * g.s * dt / P[k + "RecT"]); st.flash = Math.max(0, st.flash - dt); st.cd -= dt;
    if (k === "mo") st.shot += dt;
    if (aligned && st.cd <= 0) {
      st.cd = 1 / P[k + "Rate"]; st.rec = P[k + "Rec"] * g.s; st.flash = k === "mg" ? 0.05 : 0.14; if (k === "mo") st.shot = 0;
      const tip = muzzleOf(k, g);
      if (k === "mg") {
        const to = { x: S.target.x + (rnd() - 0.5) * P.mgSpread, y: S.target.y + (rnd() - 0.5) * P.mgSpread * P.camK };
        const L = Math.hypot(to.x - tip.x, to.y - tip.y) || 1;
        S.tracers.push({ x: tip.x, y: tip.y, ux: (to.x - tip.x) / L, uy: (to.y - tip.y) / L, left: L });
        if (P.mgCas) { const side = st.ang + Math.PI / 2, sp = 120 + rnd() * 80;
          S.casings.push({ gx: g.ground.x, gy: g.ground.y, vx: Math.cos(side) * sp, vy: Math.sin(side) * sp * P.camK, z: g.headH, vz: 200 + rnd() * 120, life: 1.2, age: 0, rot: rnd() * 6 }); }
      } else {
        S.shells.push({ gx0: tip.x, gy0: g.ground.y, tx: S.target.x, ty: S.target.y, z0: g.ground.y - tip.y, t: 0 });
      }
    }
  }
  for (let i = S.tracers.length - 1; i >= 0; i--) { const b = S.tracers[i], d = Math.min(b.left, P.mgTrSp * dt); b.x += b.ux * d; b.y += b.uy * d; b.left -= d;
    if (b.left <= 0) { S.tracers.splice(i, 1); for (let j = 0; j < 4; j++) S.sparks.push(spark(b.x, b.y, 380, "255,210,120", 0.25)); } }
  for (let i = S.casings.length - 1; i >= 0; i--) { const c = S.casings[i]; c.age += dt; if (c.age > c.life) { S.casings.splice(i, 1); continue; }
    c.vz -= 1400 * dt; c.z += c.vz * dt; if (c.z < 0) { c.z = 0; c.vz *= -0.35; c.vx *= 0.6; c.vy *= 0.6; } c.gx += c.vx * dt; c.gy += c.vy * dt; c.rot += 14 * dt; }
  for (let i = S.shells.length - 1; i >= 0; i--) { const s = S.shells[i]; s.t += dt / P.moFlight;
    if (s.t >= 1) { S.shells.splice(i, 1); S.blasts.push({ x: s.tx, y: s.ty, age: 0 }); for (let j = 0; j < 40; j++) S.sparks.push(spark(s.tx, s.ty, 700, rnd() < 0.5 ? "255,170,60" : "255,90,40", 0.6)); } }
  for (let i = S.blasts.length - 1; i >= 0; i--) { S.blasts[i].age += dt; if (S.blasts[i].age > 0.9) S.blasts.splice(i, 1); }
  for (let i = S.sparks.length - 1; i >= 0; i--) { const p = S.sparks[i]; p.age += dt; if (p.age > p.life) { S.sparks.splice(i, 1); continue; } p.vy += 1100 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
}
function spark(x, y, sp, c, life) { const a = -Math.PI / 2 + (rnd() - 0.5) * 2.6, v = sp * (0.3 + rnd() * 0.7); return { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.8, age: 0, life: life * (0.5 + rnd()), c }; }
function shellPos(s) { const gx = s.gx0 + (s.tx - s.gx0) * s.t, gy = s.gy0 + (s.ty - s.gy0) * s.t, z = s.z0 * (1 - s.t) + 4 * P.moArc * s.t * (1 - s.t); return { gx, gy, z, x: gx, y: gy - z }; }
function glow(x, y, r, rgb, a) { if (r <= 0 || a <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

// draw the head layers into `off`, put its cast shadow on the ground, return a function that draws the head
function drawHead(k, g) {
  const o = off.getContext("2d"), st = S.tur[k];
  o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, off.width, off.height);
  if (k === "mo" && mode.mo === "tilt") {
    const tp = tiltPlace(g), T = MO.tilt;
    o.save(); o.translate(tp.at.x, tp.at.y); o.scale(tp.hs, tp.hs); o.drawImage(img.mo_cradle, -T.housing.x, -T.housing.y); o.restore();
    o.save(); o.translate(tp.piv.x, tp.piv.y); o.rotate(st.tilt); o.scale(tp.hs, tp.hs);
    const cx = T.pivot.x, w = img.mo_shaft.width, overlap = 12;
    // inner shaft (narrower, behind the sleeve), stretched to its current length
    const sr = T.shaftRows, shTop = -tp.outerLen - tp.shaftLen;
    o.save(); o.translate(0, 0); o.scale(P.moInW, 1);
    o.drawImage(img.mo_shaft, 0, sr[0], w, sr[1] - sr[0], -cx, shTop, w, tp.shaftLen + overlap);
    const cr = T.capRows;
    o.drawImage(img.mo_cap, 0, cr[0], w, cr[1] - cr[0], -cx, shTop - tp.capLen, w, tp.capLen);
    o.restore();
    // outer sleeve on top
    o.drawImage(img.mo_outer, 0, T.outerTop, w, T.pivot.y - T.outerTop + 3, -cx, -tp.outerLen, w, tp.outerLen + 3);
    o.restore();
  } else {
    for (const p of pickViews(k, st.ang)) {
      const hp = headPlace(k, g, p.v, p.rot, st.rec);
      o.save(); o.globalAlpha = p.w; o.translate(hp.at.x, hp.at.y); o.rotate(hp.rot); o.scale(hp.hs, hp.hs);
      o.drawImage(img[`${k}_h${VIEWS[p.v]}`], -hp.hx, -hp.hy); o.restore();
    }
  }
  ctx.save(); ctx.globalAlpha = P[k + "ShA"]; ctx.filter = "brightness(0)";
  ctx.drawImage(off, P.sunX * g.headH, P.sunY * g.headH + g.headH * P[k + "ShDrop"]); ctx.restore();
  return () => ctx.drawImage(off, 0, 0);
}
function drawTurret(k) {
  const g = geo(k), R = g.R, st = S.tur[k];
  const bm = [g.s, 0, 0, g.s, g.ringW.x - R.ring.x * g.s, g.ringW.y - R.ring.y * g.s];
  ctx.setTransform(...bm); ctx.globalAlpha = Math.min(1, P[k + "BShA"]); ctx.drawImage(img[k + "_baseShadow"], 0, 0); ctx.globalAlpha = 1; ctx.setTransform(1, 0, 0, 1, 0, 0);
  const drawOnTop = drawHead(k, g);
  ctx.setTransform(...bm); ctx.drawImage(img[k + "_base"], 0, 0); ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawOnTop();
  const tip = muzzleOf(k, g);
  if (st.flash > 0) { ctx.save(); ctx.globalCompositeOperation = "lighter"; const f = P[k + "Flash"] * g.s * (0.7 + 0.6 * rnd());
    glow(tip.x, tip.y, f, "255,190,90", 0.9); glow(tip.x, tip.y, f * 0.4, "255,250,220", 1); ctx.restore(); }
  if (document.getElementById("markers").checked) {
    ctx.fillStyle = "#0ff"; ctx.beginPath(); ctx.arc(tip.x, tip.y, 6, 0, 7); ctx.fill();
    ctx.fillStyle = "#ff0"; ctx.beginPath(); ctx.arc(g.ringW.x, g.ringW.y, 6, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,0,0.35)"; ctx.beginPath(); ctx.ellipse(g.ground.x, g.ground.y, P[k + "Range"], P[k + "Range"] * P.camK, 0, 0, 7); ctx.stroke();
  }
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#3d4a3a"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 1;
  for (let x = 0; x < cv.width; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height); ctx.stroke(); }
  for (let y = 0; y < cv.height; y += 100 * P.camK) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cv.width, y); ctx.stroke(); }
  for (const b of S.blasts) { const k = b.age / 0.9;
    ctx.fillStyle = `rgba(20,10,5,${0.35 * (1 - k)})`; ctx.beginPath(); ctx.ellipse(b.x, b.y, P.moBlast * 0.8, P.moBlast * 0.8 * P.camK, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(255,200,120,${1 - k})`; ctx.lineWidth = 6 * (1 - k) + 1; ctx.beginPath(); ctx.ellipse(b.x, b.y, P.moBlast * (0.3 + k), P.moBlast * (0.3 + k) * P.camK, 0, 0, 7); ctx.stroke(); }
  ctx.strokeStyle = "#ff4d4d"; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(S.target.x, S.target.y, 40, 40 * P.camK, 0, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(S.target.x - 55, S.target.y); ctx.lineTo(S.target.x + 55, S.target.y); ctx.moveTo(S.target.x, S.target.y - 30); ctx.lineTo(S.target.x, S.target.y + 30); ctx.stroke();
  for (const s of S.shells) { const p = shellPos(s); ctx.fillStyle = "rgba(3,11,26,0.35)"; ctx.beginPath(); ctx.ellipse(p.gx + P.sunX * p.z, p.gy + P.sunY * p.z, P.moShell * 1.2, P.moShell * 0.6, 0, 0, 7); ctx.fill(); }
  for (const c of S.casings) { ctx.save(); ctx.translate(c.gx, c.gy - c.z); ctx.rotate(c.rot); ctx.fillStyle = `rgba(230,180,70,${1 - c.age / c.life})`; ctx.fillRect(-5, -2, 10, 4); ctx.restore(); }
  for (const k of ["mg", "mo"].sort((a, b) => P[a + "Y"] - P[b + "Y"])) drawTurret(k);
  for (const s of S.shells) { const p = shellPos(s); ctx.fillStyle = "#2d2f33"; ctx.beginPath(); ctx.arc(p.x, p.y, P.moShell, 0, 7); ctx.fill(); ctx.fillStyle = "#f6c454"; ctx.beginPath(); ctx.arc(p.x - P.moShell * 0.3, p.y - P.moShell * 0.3, P.moShell * 0.35, 0, 7); ctx.fill(); }
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  for (const b of S.tracers) { ctx.strokeStyle = "rgba(255,220,120,0.95)"; ctx.lineWidth = P.mgTrW; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.ux * P.mgTrL, b.y - b.uy * P.mgTrL); ctx.stroke(); }
  for (const b of S.blasts) { const k = b.age / 0.9; if (k < 0.35) { glow(b.x, b.y - 20, P.moBlast * (1.2 - k), "255,160,60", 0.9 * (1 - k / 0.35)); glow(b.x, b.y - 20, P.moBlast * 0.4, "255,245,210", 1 - k / 0.35); } }
  for (const p of S.sparks) { const a = 1 - p.age / p.life; ctx.strokeStyle = `rgba(${p.c},${a})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02); ctx.stroke(); }
  ctx.restore();
}

let playing = true, last = 0, acc = 0;
function frame(now) {
  if (FIXED_T === null && playing) { const dt = Math.min(0.1, (now - last) / 1000 || 0); acc += dt; while (acc >= 1 / 60) { step(1 / 60); acc -= 1 / 60; } }
  last = now; draw(); requestAnimationFrame(frame);
}
function buildUI() {
  const root = document.getElementById("controls"), groups = {};
  const group = name => { if (!groups[name]) { const d = document.createElement("details"); d.open = false;
    const s = document.createElement("summary"); s.textContent = name; d.appendChild(s); root.appendChild(d); groups[name] = d; } return groups[name]; };
  for (const [k, g, label, min, max, step] of SPEC) {
    const L = document.createElement("label"); L.innerHTML = `${label} <span id="v_${k}"></span>`;
    const I = document.createElement("input"); I.type = "range"; I.min = min; I.max = max; I.step = step; I.id = k; I.value = P[k];
    I.addEventListener("input", e => { P[k] = +e.target.value; refresh(); }); group(g).appendChild(L); group(g).appendChild(I);
  }
  refresh();
}
function refresh() {
  for (const [k, , , , , step] of SPEC) { document.getElementById(k).value = P[k]; document.getElementById("v_" + k).textContent = (+P[k]).toFixed(step >= 1 ? 0 : step >= 0.1 ? 1 : 2); }
  document.getElementById("out").value = JSON.stringify({ ...P, mgMode: mode.mg, moMode: mode.mo }, null, 1);
}
function start() {
  buildUI();
  document.getElementById("mgMode").value = mode.mg; document.getElementById("moMode").value = mode.mo;
  document.getElementById("mgMode").addEventListener("change", e => { mode.mg = e.target.value; refresh(); });
  document.getElementById("moMode").addEventListener("change", e => { mode.mo = e.target.value; refresh(); });
  if (FIXED_T !== null) { const n = Math.round(FIXED_T * 60); for (let i = 0; i < n; i++) step(1 / 60); }
  document.getElementById("play").onclick = e => { playing = !playing; e.target.textContent = playing ? "Пауза" : "Грати"; };
  document.getElementById("move").onclick = () => { S.moving = true; };
  document.getElementById("reset").onclick = () => { Object.assign(P, DEFAULTS); refresh(); };
  document.getElementById("copy").onclick = () => { const t = document.getElementById("out"); t.select(); navigator.clipboard?.writeText(t.value); document.execCommand("copy"); };
  let down = false;
  const toCanvas = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
  const setT = e => { S.moving = false; S.target = toCanvas(e); };
  cv.addEventListener("mousedown", e => { down = true; setT(e); }); window.addEventListener("mousemove", e => { if (down) setT(e); }); window.addEventListener("mouseup", () => { down = false; });
  requestAnimationFrame(frame);
}
</script>
