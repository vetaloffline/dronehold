<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Бур з лазером — тест анімації</title>
<!-- Відкривати з папки бура: картинки беруться поруч. Числа за замовчуванням = drill_rig.json. -->
<style>
  body { margin: 0; display: flex; height: 100vh; font: 13px system-ui, sans-serif; background: #1e2328; color: #ddd; }
  #view { flex: 1; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100vh; }
  #panel { width: 310px; padding: 12px 14px; background: #262c33; overflow-y: auto; box-sizing: border-box; }
  details { border-top: 1px solid #39424c; padding: 4px 0; }
  summary { cursor: pointer; color: #8fd3ff; font-weight: 600; padding: 4px 0; }
  label { display: block; margin: 6px 0 1px; }
  label span { float: right; color: #ffd27a; }
  input[type=range] { width: 100%; }
  input[type=color] { width: 100%; height: 24px; border: 0; background: none; }
  button { width: 100%; padding: 7px; margin-top: 6px; background: #3a4450; color: #fff; border: 1px solid #556; border-radius: 4px; cursor: pointer; }
  textarea { width: 100%; height: 140px; margin-top: 8px; background: #161a1e; color: #cfe; border: 1px solid #445; font: 11px monospace; }
  #phase { color: #ffd27a; font-weight: bold; }
  #msg { color: #ffb070; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div id="view"><canvas id="c" width="1800" height="1250"></canvas></div>
<div id="panel">
  <div>Фаза: <span id="phase"></span></div>
  <div style="display:flex;gap:6px"><button id="mPlay">▶ Грати</button><button id="mUp">❚ Піднято</button><button id="mFire">❚ Стріляє</button></div>
  <label>Таймлайн (тягни — перемотка) <span id="v_scrub"></span></label><input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
  <div class="hint" style="color:#999;font-size:12px">Повзунки пози «стріляє», променя, іскор, удару — самі заморожують у «стріляє»; пози «піднято» — у «піднято».</div>
  <button id="reset">Скинути все</button>
  <div id="msg"></div>
  <div id="controls"></div>
  <details><summary>Перегляд</summary>
    <label><input id="crystal" type="checkbox" checked> кристал у точці удару (чернетка)</label>
    <label><input id="pivots" type="checkbox"> показати шарніри і лінзу</label>
  </details>
  <button id="copy">Скопіювати параметри</button>
  <textarea id="out" readonly></textarea>
</div>
<script>
const SRC = { body: "drill_body.png", bodyShadow: "drill_body_shadow.png",
              seg1: "drill_arm_1.png", seg2: "drill_arm_2.png", seg3: "drill_arm_3.png" };
const OPTIONAL = { crystal: "crystal_ref.png" };            // preview only, may be missing
// rig — mirrors drill_rig.json (shared pixel space of all drill PNGs)
const BODY_POS = { x: 0, y: 0 };
const SHOULDER_GROUND = { x: 1010, y: 680 };
const SHOULDER = { x: 1000, y: 225 };
const SEG1 = { pivot: { x: 615, y: 140 }, end: { x: 300, y: 275 } };
const SEG2 = { pivot: { x: 450, y: 405 }, end: { x: 308, y: 608 } };
const SEG3 = { pivot: { x: 308, y: 608 }, end: { x: 96, y: 932 } };   // wrist -> laser lens centre
const OFF = { x: 140, y: 120 };

// [key, group, label, min, max, step, default]
const SPEC = [
  ["u1", "Поза «піднято», °", "Плече", -40, 80, 1, 80],
  ["u2", "Поза «піднято», °", "Лікоть", -80, 60, 1, -65],
  ["u3", "Поза «піднято», °", "Голова", -80, 80, 1, 9],
  ["f1", "Поза «стріляє», °", "Плече", -40, 80, 1, 31],
  ["f2", "Поза «стріляє», °", "Лікоть", -80, 60, 1, -31],
  ["f3", "Поза «стріляє», °", "Голова", -80, 80, 1, 2],
  ["tMove", "Час, с", "Опускання / підйом", 0.1, 3, 0.05, 0.5],
  ["tCharge", "Час, с", "Заряд лінзи", 0, 3, 0.05, 0.6],
  ["tFire", "Час, с", "Стріляє", 0.2, 8, 0.1, 2.5],
  ["tCool", "Час, с", "Охолодження", 0, 3, 0.05, 0.5],
  ["tWait", "Час, с", "Чекає вгорі", 0, 6, 0.1, 1],
  ["recoil", "Час, с", "Тремтіння при пострілі", 0, 3, 0.05, 0.5],
  ["tipX", "Промінь", "Точка виходу: зсув X", -80, 80, 1, 5],
  ["tipY", "Промінь", "Точка виходу: зсув Y", -80, 80, 1, 0],
  ["aim", "Промінь", "Кут променя відносно труби, °", -45, 45, 0.5, -9],
  ["groundY", "Промінь", "Рівень землі для удару, px", 600, 1250, 1, 1095],
  ["maxLen", "Промінь", "Макс. довжина, px", 50, 1500, 10, 1020],
  ["coreW", "Промінь", "Товщина ядра", 0.5, 20, 0.5, 12],
  ["glowW", "Промінь", "Товщина сяйва", 2, 80, 1, 60],
  ["glowA", "Промінь", "Яскравість сяйва", 0, 1, 0.01, 0.58],
  ["flickA", "Промінь", "Мерехтіння: сила", 0, 1, 0.01, 0.8],
  ["flickS", "Промінь", "Мерехтіння: швидкість", 0, 60, 0.5, 33],
  ["startT", "Промінь", "Розгін променя, с", 0, 1, 0.01, 0],
  ["lensR", "Лінза", "Сяйво лінзи, радіус", 0, 120, 1, 66],
  ["lensA", "Лінза", "Сяйво лінзи, яскравість", 0, 1, 0.01, 1],
  ["hotR", "Точка удару", "Розжарена пляма, радіус", 0, 200, 1, 83],
  ["hotA", "Точка удару", "Пляма, яскравість", 0, 1, 0.01, 0.58],
  ["hotPulse", "Точка удару", "Пляма, пульсація", 0, 1, 0.01, 0.17],
  ["sRate", "Іскри", "Скільки за кадр", 0, 30, 1, 6],
  ["sSpeed", "Іскри", "Швидкість", 50, 1500, 10, 520],
  ["sSpread", "Іскри", "Розкид, °", 0, 360, 1, 162],
  ["sDir", "Іскри", "Напрям (0 = вгору), °", -180, 180, 1, 20],
  ["sGrav", "Іскри", "Гравітація", 0, 3000, 10, 720],
  ["sLife", "Іскри", "Життя, с", 0.05, 2, 0.01, 0.72],
  ["sSize", "Іскри", "Розмір", 0.5, 10, 0.1, 4.3],
  ["sTail", "Іскри", "Довжина хвоста", 0, 0.1, 0.002, 0.026],
  ["sTx", "Тінь руки", "Зсув вліво на 1 px висоти", -2, 0, 0.05, -0.3],
  ["sTy", "Тінь руки", "Зсув вниз на 1 px висоти", -0.5, 1, 0.05, 0.2],
  ["sK", "Тінь руки", "Товщина тіні", 0.2, 1.5, 0.05, 0.85],
  ["sOp", "Тінь руки", "Прозорість", 0, 1, 0.05, 0.35],
  ["sBlur", "Тінь руки", "Розмиття, px", 0, 20, 1, 2],
];
const COLORS = [["cBeam", "Промінь", "Колір сяйва", "#ff2a2a"], ["cCore", "Промінь", "Колір ядра", "#fff1e6"],
                ["cHot", "Точка удару", "Колір плями", "#ff7a2a"], ["cSpark", "Іскри", "Колір іскор", "#ff5030"]];
const P = {};
for (const s of SPEC) P[s[0]] = s[6];
for (const c of COLORS) P[c[0]] = c[3];
const DEFAULTS = { ...P };

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const img = {}; let loaded = 0; const NIMG = Object.keys(SRC).length;
for (const k in SRC) {
  img[k] = new Image();
  img[k].onload = () => { if (++loaded === NIMG) start(); };
  img[k].onerror = () => { document.getElementById("msg").textContent = "Не знайдено " + SRC[k] + " — відкрий сторінку з папки бура."; };
  img[k].src = SRC[k];
}
for (const k in OPTIONAL) { const i = new Image(); i.onload = () => { img[k] = i; }; i.src = OPTIONAL[k]; }

const dark = {};
function makeDark() {
  for (const k of ["seg1", "seg2", "seg3"]) {
    const c = document.createElement("canvas"); c.width = img[k].width; c.height = img[k].height;
    const g = c.getContext("2d"); g.drawImage(img[k], 0, 0);
    g.globalCompositeOperation = "source-in"; g.fillStyle = "rgb(3,11,26)"; g.fillRect(0, 0, c.width, c.height);
    dark[k] = c;
  }
}
const shadowCv = document.createElement("canvas"); shadowCv.width = cv.width; shadowCv.height = cv.height;

const rad = d => d * Math.PI / 180;
const rot = (v, a) => ({ x: v.x * Math.cos(a) - v.y * Math.sin(a), y: v.x * Math.sin(a) + v.y * Math.cos(a) });
const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const len = v => Math.hypot(v.x, v.y);
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(",");

// arm shadow per joint (same model as drill_anim.html)
const L1 = len(sub(SEG1.end, SEG1.pivot)), L2 = len(sub(SEG2.end, SEG2.pivot)), L3 = len(sub(SEG3.end, SEG3.pivot));
const FRAC = [0, L1 / (L1 + L2 + L3), (L1 + L2) / (L1 + L2 + L3), 1];
function segShadowMatrix(Pj, Qj, Ps, Qs) {
  const u0 = sub(Qj, Pj), lu = len(u0), u = { x: u0.x / lu, y: u0.y / lu }, n = { x: -u.y, y: u.x };
  const v0 = sub(Qs, Ps), lv = len(v0), v = { x: v0.x / lv, y: v0.y / lv }, m = { x: -v.y, y: v.x };
  const s = lv / lu, k = P.sK;
  const a = s * v.x * u.x + k * m.x * n.x, b = s * v.x * u.y + k * m.x * n.y;
  const c = s * v.y * u.x + k * m.y * n.x, d = s * v.y * u.y + k * m.y * n.y;
  return [a, c, b, d, Ps.x - (a * Pj.x + b * Pj.y), Ps.y - (c * Pj.x + d * Pj.y)];
}

function rig(a1, a2, a3) {
  const s = add(SHOULDER, OFF);
  const elbow = add(s, rot(sub(SEG1.end, SEG1.pivot), a1));
  const wrist = add(elbow, rot(sub(SEG2.end, SEG2.pivot), a1 + a2));
  const tip = add(wrist, rot(sub(SEG3.end, SEG3.pivot), a1 + a2 + a3));
  return { s, elbow, wrist, tip, A1: a1, A2: a1 + a2, A3: a1 + a2 + a3 };
}
function drawPart(im, pivot, at, ang) {
  ctx.save(); ctx.translate(at.x, at.y); ctx.rotate(ang); ctx.drawImage(im, -pivot.x, -pivot.y); ctx.restore();
}

// ---- phases
const PHASES = () => [["опускає", P.tMove], ["заряд", P.tCharge], ["стріляє", P.tFire], ["охолодження", P.tCool], ["піднімає", P.tMove], ["чекає", P.tWait]];
function phaseAt(t) {
  const L = PHASES(); const total = L.reduce((s, x) => s + x[1], 0) || 1; let k = t % total;
  for (const [name, d] of L) { if (k < d) return { name, k: d ? k / d : 1, el: k }; k -= d; }
  return { name: "чекає", k: 1, el: 0 };
}

// ---- sparks
const sparks = [];
function spawnSparks(at, dt, power) {
  const n = Math.round(P.sRate * power);
  for (let i = 0; i < n; i++) {
    const ang = rad(-90 + P.sDir + (Math.random() - 0.5) * P.sSpread);
    const sp = P.sSpeed * (0.35 + Math.random() * 0.65);
    sparks.push({ x: at.x, y: at.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, age: 0, life: P.sLife * (0.5 + Math.random()) });
  }
}
function stepSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.age += dt; if (p.age > p.life) { sparks.splice(i, 1); continue; }
    p.vy += P.sGrav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawSparks() {
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  const rgb = hexRgb(P.cSpark);
  for (const p of sparks) {
    const a = 1 - p.age / p.life;
    ctx.strokeStyle = `rgba(${rgb},${a})`; ctx.lineWidth = P.sSize * (0.6 + a * 0.6);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * P.sTail, p.y - p.vy * P.sTail); ctx.stroke();
  }
  ctx.restore();
}

function glow(at, r, rgb, a) {
  if (r <= 0 || a <= 0) return;
  const g = ctx.createRadialGradient(at.x, at.y, 0, at.x, at.y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(at.x, at.y, r, 0, 7); ctx.fill();
}

// beam ray from the lens along the barrel (+aim), until it hits the ground row or maxLen
function beamEnd(T, dirAng) {
  const d = { x: Math.cos(dirAng), y: Math.sin(dirAng) };
  let L = P.maxLen;
  if (d.y > 0.01) L = Math.min(L, (P.groundY - T.y) / d.y);
  L = Math.max(0, L);
  return { x: T.x + d.x * L, y: T.y + d.y * L };
}

let t0 = performance.now(), last = t0;
// mode: "play" = loop; "up" / "fire" = frozen pose (beam and sparks keep running in "fire"); "scrub" = timeline position
let mode = "play", scrubT = 0;
function setMode(m) {
  mode = m;
  for (const [id, mm] of [["mPlay", "play"], ["mUp", "up"], ["mFire", "fire"]])
    document.getElementById(id).style.background = mm === mode ? "#5a6b2a" : "#3a4450";
  if (m === "play") t0 = performance.now() - scrubT * 1000;
}
const cycleLen = () => PHASES().reduce((s, x) => s + x[1], 0) || 1;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let ph;
  if (mode === "up") ph = { name: "чекає", k: 1, el: 0 };
  else if (mode === "fire") ph = { name: "стріляє", k: 0.5, el: 99 };
  else {
    const t = mode === "play" ? (now - t0) / 1000 : scrubT;
    if (mode === "play") { scrubT = t % cycleLen(); const sc = document.getElementById("scrub"); sc.value = scrubT / cycleLen(); }
    document.getElementById("v_scrub").textContent = scrubT.toFixed(2) + " с";
    ph = phaseAt(t);
  }
  const up = [P.u1, P.u2, P.u3].map(rad), fr = [P.f1, P.f2, P.f3].map(rad);
  let m = 0;                                                      // 0 = up, 1 = firing pose
  if (ph.name === "опускає") m = ease(ph.k); else if (ph.name === "піднімає") m = 1 - ease(ph.k);
  else if (ph.name === "заряд" || ph.name === "стріляє" || ph.name === "охолодження") m = 1;
  const a = up.map((u, i) => lerp(u, fr[i], m));
  // power: 0..1 lens charge; beam only while firing
  let charge = 0, beamOn = 0;
  if (ph.name === "заряд") charge = ph.k;
  else if (ph.name === "стріляє") { charge = 1; beamOn = P.startT > 0 ? Math.min(1, ph.el / P.startT) : 1; }
  else if (ph.name === "охолодження") charge = 1 - ph.k;
  let jx = 0, jy = 0;
  if (ph.name === "стріляє") {
    a[2] += rad(Math.sin(now * 0.08) * 0.6 * P.recoil);
    jx = Math.sin(now * 0.11) * 1.2 * P.recoil; jy = Math.cos(now * 0.13) * 0.8 * P.recoil;
  }
  const R = rig(a[0], a[1], a[2]);
  // lens point: SEG3.end plus a fine offset in the head's own frame
  const T = add(add(R.wrist, rot(sub(SEG3.end, SEG3.pivot), R.A3)), rot({ x: P.tipX, y: P.tipY }, R.A3));
  T.x += jx; T.y += jy;
  const barrel = Math.atan2(T.y - (R.wrist.y + jy), T.x - (R.wrist.x + jx)) + rad(P.aim);
  const H = beamEnd(T, barrel);
  const flick = 1 + P.flickA * (Math.sin(now * 0.001 * P.flickS * 6.3) * 0.6 + (Math.random() - 0.5) * 0.8);

  if (beamOn > 0.5) spawnSparks(H, dt, beamOn); stepSparks(dt);

  // ---- draw
  ctx.fillStyle = "#4e7056"; ctx.fillRect(0, 0, cv.width, cv.height);
  if (img.crystal && document.getElementById("crystal").checked) {
    const firing = rig(fr[0], fr[1], fr[2]);
    const Tf = add(firing.wrist, rot(sub(SEG3.end, SEG3.pivot), firing.A3));
    const Hf = beamEnd(Tf, Math.atan2(Tf.y - firing.wrist.y, Tf.x - firing.wrist.x) + rad(P.aim));
    const w = 260, h = w * img.crystal.height / img.crystal.width;
    ctx.drawImage(img.crystal, Hf.x - w / 2, Hf.y - h * 0.75, w, h);
  }
  ctx.drawImage(img.bodyShadow, OFF.x + BODY_POS.x, OFF.y + BODY_POS.y);
  const g0 = add(SHOULDER_GROUND, OFF);
  const Fpose = rig(fr[0], fr[1], fr[2]).tip;
  const J = [R.s, R.elbow, R.wrist, R.tip];
  const SP = J.map((j, i) => { const gy = g0.y + FRAC[i] * (Fpose.y - g0.y), h = gy - j.y; return { x: j.x + P.sTx * h, y: gy + P.sTy * h }; });
  const sg = shadowCv.getContext("2d");
  sg.setTransform(1, 0, 0, 1, 0, 0); sg.clearRect(0, 0, shadowCv.width, shadowCv.height);
  for (const [i, k, part, at, ang] of [[2, "seg3", SEG3, R.wrist, R.A3], [1, "seg2", SEG2, R.elbow, R.A2], [0, "seg1", SEG1, R.s, R.A1]]) {
    sg.setTransform(...segShadowMatrix(J[i], J[i + 1], SP[i], SP[i + 1]));
    sg.translate(at.x, at.y); sg.rotate(ang); sg.drawImage(dark[k], -part.pivot.x, -part.pivot.y);
  }
  ctx.save(); ctx.globalAlpha = P.sOp; if (P.sBlur) ctx.filter = `blur(${P.sBlur}px)`; ctx.drawImage(shadowCv, 0, 0); ctx.restore();
  ctx.save(); ctx.translate(jx * 0.3, jy * 0.3); ctx.drawImage(img.body, OFF.x + BODY_POS.x, OFF.y + BODY_POS.y); ctx.restore();

  // hot spot under the beam (on the ground/crystal, below the arm)
  if (beamOn > 0) {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const pulse = 1 + P.hotPulse * Math.sin(now * 0.02);
    glow(H, P.hotR * pulse * beamOn, hexRgb(P.cHot), P.hotA * beamOn);
    glow(H, P.hotR * 0.35 * pulse * beamOn, hexRgb(P.cCore), P.hotA * beamOn);
    ctx.restore();
  }

  ctx.save(); ctx.translate(jx, jy);
  drawPart(img.seg3, SEG3.pivot, R.wrist, R.A3);
  drawPart(img.seg2, SEG2.pivot, R.elbow, R.A2);
  drawPart(img.seg1, SEG1.pivot, R.s, R.A1);
  ctx.restore();

  // beam: wide glow + mid + white-hot core, additive
  if (beamOn > 0) {
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
    const rgb = hexRgb(P.cBeam), core = hexRgb(P.cCore);
    const Hb = { x: lerp(T.x, H.x, beamOn), y: lerp(T.y, H.y, beamOn) };
    for (const [w, a, c] of [[P.glowW, P.glowA * 0.45, rgb], [P.glowW * 0.45, P.glowA, rgb], [P.coreW, 1, core]]) {
      ctx.strokeStyle = `rgba(${c},${a})`; ctx.lineWidth = Math.max(0.5, w * flick);
      ctx.beginPath(); ctx.moveTo(T.x, T.y); ctx.lineTo(Hb.x, Hb.y); ctx.stroke();
    }
    ctx.restore();
  }
  // lens glow (charge / fire / cool)
  if (charge > 0) {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    glow(T, P.lensR * charge * (beamOn ? flick : 1), hexRgb(P.cBeam), P.lensA * charge);
    glow(T, P.lensR * 0.3 * charge, hexRgb(P.cCore), P.lensA * charge);
    ctx.restore();
  }
  drawSparks();

  if (document.getElementById("pivots").checked) {
    ctx.fillStyle = "#ff0"; for (const p of [R.s, R.elbow, R.wrist]) { ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, 7); ctx.fill(); }
    ctx.fillStyle = "#0ff"; ctx.beginPath(); ctx.arc(T.x, T.y, 7, 0, 7); ctx.fill();
    ctx.strokeStyle = "#0ff"; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(0, P.groundY); ctx.lineTo(cv.width, P.groundY); ctx.stroke(); ctx.setLineDash([]);
  }
  document.getElementById("phase").textContent = ph.name;
  requestAnimationFrame(frame);
}

// ---- UI built from SPEC
function buildUI() {
  const root = document.getElementById("controls"); const groups = {};
  const group = name => {
    if (!groups[name]) { const d = document.createElement("details"); d.open = name.startsWith("Поза") || name === "Промінь";
      const s = document.createElement("summary"); s.textContent = name; d.appendChild(s); root.appendChild(d); groups[name] = d; }
    return groups[name];
  };
  const dump = () => { document.getElementById("out").value = JSON.stringify(P, null, 1); };
  for (const [k, g, label, min, max, step] of SPEC) {
    const L = document.createElement("label"); L.innerHTML = `${label} <span id="v_${k}"></span>`;
    const I = document.createElement("input"); I.type = "range"; I.min = min; I.max = max; I.step = step; I.id = k; I.value = P[k];
    const dec = step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
    const show = () => { document.getElementById("v_" + k).textContent = (+P[k]).toFixed(dec); dump(); };
    I.addEventListener("input", e => {
      P[k] = +e.target.value; show();
      if (/^u\d$/.test(k)) setMode("up");
      else if (/^f\d$/.test(k) || ["Промінь", "Лінза", "Точка удару", "Іскри"].includes(g)) setMode("fire");
    });
    group(g).appendChild(L); group(g).appendChild(I); show();
  }
  for (const [k, g, label] of COLORS) {
    const L = document.createElement("label"); L.textContent = label;
    const I = document.createElement("input"); I.type = "color"; I.id = k; I.value = P[k];
    I.addEventListener("input", e => { P[k] = e.target.value; dump(); });
    group(g).appendChild(L); group(g).appendChild(I);
  }
  dump();
}

function start() {
  buildUI(); makeDark();
  document.getElementById("mPlay").onclick = () => setMode("play");
  document.getElementById("mUp").onclick = () => setMode("up");
  document.getElementById("mFire").onclick = () => setMode("fire");
  document.getElementById("scrub").addEventListener("input", e => { scrubT = +e.target.value * cycleLen(); setMode("scrub"); });
  setMode("play");
  document.getElementById("reset").onclick = () => {
    Object.assign(P, DEFAULTS);
    for (const s of SPEC) { const el = document.getElementById(s[0]); el.value = P[s[0]]; el.dispatchEvent(new Event("input")); }
    for (const c of COLORS) document.getElementById(c[0]).value = P[c[0]];
  };
  document.getElementById("copy").onclick = () => {
    const t = document.getElementById("out"); t.select(); navigator.clipboard?.writeText(t.value); document.execCommand("copy");
  };
  requestAnimationFrame(frame);
}
</script>
