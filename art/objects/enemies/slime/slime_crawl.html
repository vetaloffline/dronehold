<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Слизень — повзання</title>
<!-- Відкривати з папки слизня: спрайт поруч, земля з map_03. Анімація тільки кодом: position, scale, skew
     (ті самі поля, що в Godot Node2D), тінь — еліпс. Числа за замовчуванням = slime_rig.json. -->
<style>
  body { margin: 0; display: flex; height: 100vh; font: 13px system-ui, sans-serif; background: #1e2328; color: #ddd; }
  #view { flex: 1; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100vh; }
  #panel { width: 310px; padding: 12px 14px; background: #262c33; overflow-y: auto; box-sizing: border-box; }
  details { border-top: 1px solid #39424c; padding: 4px 0; }
  summary { cursor: pointer; color: #8fd3ff; font-weight: 600; padding: 4px 0; }
  label { display: block; margin: 6px 0 1px; }
  label span { float: right; color: #ffd27a; }
  input[type=range] { width: 100%; }
  button { width: 100%; padding: 7px; margin-top: 6px; background: #3a4450; color: #fff; border: 1px solid #556; border-radius: 4px; cursor: pointer; }
  button.on { background: #50606f; border-color: #8fd3ff; }
  textarea { width: 100%; height: 140px; margin-top: 8px; background: #161a1e; color: #cfe; border: 1px solid #445; font: 11px monospace; }
  #info { color: #ffd27a; margin: 4px 0; }
</style>
</head>
<body>
<div id="view"><canvas id="c" width="1600" height="1000"></canvas></div>
<div id="panel">
  <div style="display:flex;gap:6px"><button id="mOne">Один</button><button id="mCrowd">Натовп</button><button id="mPause">❚❚ Пауза</button></div>
  <label>Фаза циклу (тягни — пауза) <span id="v_scrub"></span></label><input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
  <div id="info"></div>
  <button id="reset">Скинути все</button>
  <div id="controls"></div>
  <details><summary>Перегляд</summary>
    <label><input id="grid" type="checkbox"> сітка клітинок 64×48</label>
    <label><input id="pivot" type="checkbox"> pivot і рамка спрайта</label>
  </details>
  <button id="copy">Скопіювати параметри</button>
  <textarea id="out" readonly></textarea>
</div>
<script>
const SPRITE = "slime.png";
const GROUND = "../../../maps/map_03/map_03_ground.png";
const PIVOT = { x: 605, y: 718 };      // точка біля «ніг» у пікселях slime.png (низ по центру)
const SPRITE_W = 1177;               // ширина непрозорої частини slime.png, px
const VIEW0 = { x: 1900, y: 1150 };  // лівий верхній кут шматка землі map_03
const CELL = { w: 64, h: 48 };
// очі в пікселях slime.png (центр і радіуси), номери зліва направо; моргають у порядку BLINK_ORDER
// over — номери очей, що стоять попереду і закривають частину цього (повіка під ними не малюється)
const EYES = [{ x: 583, y: 386, rx: 80, ry: 66, over: [1] }, { x: 694, y: 482, rx: 82, ry: 73, over: [] },
              { x: 883, y: 443, rx: 88, ry: 88, over: [] }];
const BLINK_ORDER = [0, 2, 1];                  // 1-е → 3-тє → 2-ге
const LID = { top: "#a24cf2", bottom: "#6418b8", rim: "#2a0650" };

// [key, group, label, min, max, step, default]
const SPEC = [
  ["sizeCells", "Розмір і камера", "Ширина слизня, клітинок", 0.3, 3, 0.05, 0.8],
  ["zoom", "Розмір і камера", "Зум камери", 1, 6, 0.1, 3],
  ["period", "Цикл", "Тривалість циклу, с", 0.2, 3, 0.05, 0.9],
  ["lunge", "Цикл", "Частка розтягування (ривок)", 0.15, 0.85, 0.01, 0.4],
  ["stretch", "Форма", "Розтяг уздовж руху", 0, 0.5, 0.01, 0.14],
  ["squash", "Форма", "Сплющення по висоті", 0, 0.5, 0.01, 0.12],
  ["lean", "Форма", "Нахил верху (skew), °", 0, 30, 0.5, 8],
  ["leanPhase", "Форма", "Затримка нахилу, частка циклу", 0, 1, 0.01, 0.2],
  ["jelly", "Желе", "Пружина: сила (0 = вимк.)", 0, 1, 0.01, 0.55],
  ["damp", "Желе", "Пружина: загасання", 0.05, 1, 0.01, 0.35],
  ["inch", "Рух", "Крок «гусінь» (0 = ковзає рівно)", 0, 1, 0.01, 0.85],
  ["slide", "Рух", "Ковзання, клітинок/с", 0, 3, 0.05, 0.15],
  ["shW", "Тінь-еліпс", "Ширина, × ширини слизня", 0.3, 1.6, 0.01, 0.95],
  ["shH", "Тінь-еліпс", "Висота, × ширини", 0.05, 0.6, 0.01, 0.3],
  ["shX", "Тінь-еліпс", "Зсув X (вліво −), × ширини", -0.5, 0.5, 0.01, -0.08],
  ["shY", "Тінь-еліпс", "Зсув Y, × ширини", -0.3, 0.3, 0.01, -0.07],
  ["shA", "Тінь-еліпс", "Прозорість", 0, 1, 0.01, 0.38],
  ["bClose", "Моргання", "Закривається, с", 0.02, 0.4, 0.01, 0.07],
  ["bHold", "Моргання", "Закрите, с", 0, 0.4, 0.01, 0.05],
  ["bOpen", "Моргання", "Відкривається, с", 0.02, 0.5, 0.01, 0.11],
  ["bGap", "Моргання", "Від ока до ока, с", 0, 1, 0.01, 0.18],
  ["bPause", "Моргання", "Пауза між серіями, с", 0.2, 8, 0.1, 2.2],
  ["bRand", "Моргання", "Випадкова добавка до паузи, с", 0, 4, 0.1, 1.5],
  ["lidRim", "Моргання", "Товщина краю повіки, px спрайта", 0, 20, 1, 7],
  ["crowd", "Натовп", "Кількість", 2, 400, 1, 120],
  ["spread", "Натовп", "Розкид швидкості, ±частка", 0, 0.6, 0.01, 0.25],
];
const DEFAULTS = Object.fromEntries(SPEC.map(s => [s[0], s[6]]));
const P = Object.assign({}, DEFAULTS);

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const img = { slime: new Image(), ground: new Image() };
let loaded = 0;
for (const [k, src] of [["slime", SPRITE], ["ground", GROUND]]) {
  img[k].onload = () => { if (++loaded === 2) start(); };
  img[k].onerror = () => { document.getElementById("info").textContent = "Не знайдено: " + src; };
  img[k].src = src;
}

let mode = "one", paused = false, scrubP = 0;

// ---- анімація одного слизня (те саме переноситься в Godot _process)
// f(p): −1 стиснутий → +1 розтягнутий за частку `lunge` циклу, назад за решту
function profile(p) {
  const k = P.lunge;
  const u = p < k ? 0.5 * p / k : 0.5 + 0.5 * (p - k) / (1 - k);
  return -Math.cos(2 * Math.PI * u);
}
function newSlime(x, y, dir, rate, phase) {
  return { x, y, dir, rate, p: phase, sx: 1, sy: 1, vx: 0, vy: 0, prevTx: null,
           bt: -Math.random() * P.bPause, bWait: P.bPause };
}
// моргання: серія = очі по BLINK_ORDER з кроком bGap, далі пауза bPause + випадкова добавка
function stepBlink(s, dt) {
  s.bt += dt;
  const len = (BLINK_ORDER.length - 1) * P.bGap + P.bClose + P.bHold + P.bOpen;
  if (s.bt > len + s.bWait) { s.bt = 0; s.bWait = P.bPause + Math.random() * P.bRand; }
}
// наскільки закрите око i: 0 відкрите … 1 закрите
function lidOf(s, i) {
  const t = s.bt - BLINK_ORDER.indexOf(i) * P.bGap;
  const ease = u => u * u * (3 - 2 * u);
  if (t < 0) return 0;
  if (t < P.bClose) return ease(t / P.bClose);
  if (t < P.bClose + P.bHold) return 1;
  if (t < P.bClose + P.bHold + P.bOpen) return 1 - ease((t - P.bClose - P.bHold) / P.bOpen);
  return 0;
}
// повіка: еліпс розміром з око опускається згори, обрізаний по оку (у Godot — clip_children)
function drawLids(s) {
  EYES.forEach((e, i) => {
    const c = lidOf(s, i);
    if (c <= 0) return;
    const ly = e.y - 2 * e.ry + 2 * e.ry * c;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(e.x, e.y, e.rx + 2, e.ry + 2, 0, 0, 2 * Math.PI); ctx.clip();
    for (const j of e.over) {
      const o = EYES[j]; ctx.beginPath(); ctx.rect(e.x - 4 * e.rx, e.y - 4 * e.ry, 8 * e.rx, 8 * e.ry);
      ctx.ellipse(o.x, o.y, o.rx, o.ry, 0, 0, 2 * Math.PI); ctx.clip("evenodd");
    }
    const gr = ctx.createLinearGradient(0, e.y - e.ry, 0, e.y + e.ry);
    gr.addColorStop(0, LID.top); gr.addColorStop(1, LID.bottom);
    ctx.fillStyle = gr; ctx.strokeStyle = LID.rim; ctx.lineWidth = P.lidRim;
    ctx.beginPath(); ctx.ellipse(e.x, ly, e.rx * 1.2, e.ry, 0, 0, 2 * Math.PI); ctx.fill();
    if (P.lidRim > 0) ctx.stroke();
    ctx.restore();
  });
}
// крок симуляції: dt у секундах, (dx,dy) — одиничний напрям руху на екрані
function stepSlime(s, dt, dx, dy) {
  const W = P.sizeCells * CELL.w;
  stepBlink(s, dt);
  s.p =(s.p + dt * s.rate / P.period) % 1;
  const f = profile(s.p);
  const tx = 1 + P.stretch * f, ty = 1 - P.squash * f;
  if (P.jelly > 0) {
    const k = 40 + 360 * P.jelly, c = 2 * Math.sqrt(k) * P.damp;
    s.vx += (k * (tx - s.sx) - c * s.vx) * dt; s.sx += s.vx * dt;
    s.vy += (k * (ty - s.sy) - c * s.vy) * dt; s.sy += s.vy * dt;
  } else { s.sx = tx; s.sy = ty; }
  // «гусінь»: при розтягуванні стоїть задній край, при стисканні — передній
  const dTx = s.prevTx === null ? 0 : tx - s.prevTx; s.prevTx = tx;
  const adv = P.inch * W / 2 * Math.abs(dTx) + P.slide * CELL.w * s.rate * dt;
  s.x += dx * adv; s.y += dy * adv;
  if (dx !== 0) s.dir = dx > 0 ? 1 : -1;
}
function skewOf(s) {
  const q = (s.p - P.leanPhase + 1) % 1;
  return -(P.lean * Math.PI / 180) * profile(q) * s.dir;
}
// середня швидкість, клітинок/с — для підбору в грі: rate = speed_гри / avgSpeed()
function avgSpeed() {
  return (P.inch * P.sizeCells * 2 * P.stretch + P.slide * P.period) / P.period;
}

// ---- малювання
function drawSlime(s, cam) {
  const W = P.sizeCells * CELL.w, k = W / SPRITE_W;          // масштаб спрайта на карті
  const X = (s.x - cam.x) * cam.z, Y = (s.y - cam.y) * cam.z, z = cam.z;
  // тінь-еліпс: ширина слідує за розтягом
  ctx.save(); ctx.globalAlpha = P.shA; ctx.fillStyle = "#14081c";
  ctx.beginPath();
  ctx.ellipse(X + P.shX * W * z * s.dir, Y + P.shY * W * z, P.shW * W * z * s.sx / 2, P.shH * W * z / 2, 0, 0, 2 * Math.PI);
  ctx.fill(); ctx.restore();
  // Godot Transform2D(rotation 0, scale, skew): x = (sx,0), y = (−sin(skew)·sy, cos(skew)·sy)
  const sk = skewOf(s), sx = s.sx * s.dir * k * z, sy = s.sy * k * z;
  ctx.save();
  ctx.setTransform(sx, 0, -Math.sin(sk) * sy, Math.cos(sk) * sy, X, Y);
  ctx.drawImage(img.slime, -PIVOT.x, -PIVOT.y);
  ctx.translate(-PIVOT.x, -PIVOT.y); drawLids(s); ctx.translate(PIVOT.x, PIVOT.y);
  if (document.getElementById("pivot").checked) {
    ctx.strokeStyle = "#0ff"; ctx.lineWidth = 2 / (k * z);
    ctx.strokeRect(-PIVOT.x, -PIVOT.y, img.slime.width, img.slime.height);
  }
  ctx.restore();
  if (document.getElementById("pivot").checked) { ctx.fillStyle = "#f00"; ctx.fillRect(X - 3, Y - 3, 6, 6); }
}
function drawGround(cam) {
  const w = cv.width / cam.z, h = cv.height / cam.z;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(img.ground, cam.x, cam.y, w, h, 0, 0, cv.width, cv.height);
  if (document.getElementById("grid").checked) {
    ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1; ctx.beginPath();
    for (let gx = Math.ceil(cam.x / CELL.w) * CELL.w; gx < cam.x + w; gx += CELL.w) { const X = (gx - cam.x) * cam.z; ctx.moveTo(X, 0); ctx.lineTo(X, cv.height); }
    for (let gy = Math.ceil(cam.y / CELL.h) * CELL.h; gy < cam.y + h; gy += CELL.h) { const Y = (gy - cam.y) * cam.z; ctx.moveTo(0, Y); ctx.lineTo(cv.width, Y); }
    ctx.stroke();
  }
}

// ---- сцени
let one = null, crowd = [];
function camOne() { return { x: VIEW0.x, y: VIEW0.y, z: P.zoom }; }
function resetOne() {
  const cam = camOne(), w = cv.width / cam.z, h = cv.height / cam.z;
  one = newSlime(cam.x + w * 0.2, cam.y + h * 0.62, 1, 1, 0);
}
function stepOne(dt) {
  const cam = camOne(), w = cv.width / cam.z;
  const left = cam.x + w * 0.12, right = cam.x + w * 0.88;
  if (one.x > right) one.dir = -1; else if (one.x < left) one.dir = 1;
  stepSlime(one, dt, one.dir, 0);
}
// натовп повзе до «ядра» в центрі кадру; дійшов — з'являється знову з краю
function camCrowd() { return { x: VIEW0.x - 300, y: VIEW0.y - 200, z: Math.max(1, P.zoom / 2.5) }; }
function spawnCrowd(s) {
  const cam = camCrowd(), w = cv.width / cam.z, h = cv.height / cam.z;
  const a = Math.random() * 2 * Math.PI;
  s.x = cam.x + w / 2 + Math.cos(a) * w * 0.55; s.y = cam.y + h / 2 + Math.sin(a) * h * 0.55;
}
function resetCrowd() {
  crowd = [];
  for (let i = 0; i < P.crowd; i++) {
    const s = newSlime(0, 0, 1, 1 + (Math.random() * 2 - 1) * P.spread, Math.random());
    spawnCrowd(s);
    const cam = camCrowd(), w = cv.width / cam.z, h = cv.height / cam.z, t = 0.15 + Math.random() * 0.85;
    s.x = cam.x + w / 2 + (s.x - cam.x - w / 2) * t; s.y = cam.y + h / 2 + (s.y - cam.y - h / 2) * t;
    crowd.push(s);
  }
}
function stepCrowd(dt) {
  const cam = camCrowd(), w = cv.width / cam.z, h = cv.height / cam.z, cx = cam.x + w / 2, cy = cam.y + h / 2;
  if (crowd.length !== P.crowd) resetCrowd();
  for (const s of crowd) {
    const ex = cx - s.x, ey = (cy - s.y), d = Math.hypot(ex, ey);
    if (d < P.sizeCells * CELL.w * 1.5) { spawnCrowd(s); continue; }
    stepSlime(s, dt, ex / d, ey / d);
  }
}

let last = null, fps = 60;
function frame(now) {
  const dt = last === null ? 0 : Math.min(0.05, (now - last) / 1000); last = now;
  if (dt > 0) fps = fps * 0.95 + 0.05 / dt;
  if (mode === "one") {
    if (!paused) stepOne(dt);
    else { one.p = scrubP; const f = profile(scrubP); one.sx = 1 + P.stretch * f; one.sy = 1 - P.squash * f; }
    const cam = camOne(); drawGround(cam); drawSlime(one, cam);
    document.getElementById("scrub").value = one.p;
    document.getElementById("v_scrub").textContent = one.p.toFixed(2);
  } else {
    if (!paused) stepCrowd(dt);
    const cam = camCrowd(); drawGround(cam);
    for (const s of crowd.slice().sort((a, b) => a.y - b.y)) drawSlime(s, cam);   // Y-sort
  }
  document.getElementById("info").textContent =
    `швидкість ≈ ${avgSpeed().toFixed(2)} клітинок/с · ${Math.round(fps)} FPS` + (mode === "crowd" ? ` · ${crowd.length} шт.` : "");
  requestAnimationFrame(frame);
}

// ---- UI з SPEC
function setMode(m) {
  mode = m; paused = false;
  document.getElementById("mOne").classList.toggle("on", m === "one");
  document.getElementById("mCrowd").classList.toggle("on", m === "crowd");
  document.getElementById("mPause").classList.remove("on");
  if (m === "one") resetOne(); else resetCrowd();
}
function buildUI() {
  const root = document.getElementById("controls"); const groups = {};
  const group = name => {
    if (!groups[name]) { const d = document.createElement("details"); d.open = name !== "Натовп";
      const s = document.createElement("summary"); s.textContent = name; d.appendChild(s); root.appendChild(d); groups[name] = d; }
    return groups[name];
  };
  const dump = () => { document.getElementById("out").value = JSON.stringify(P, null, 1); };
  for (const [k, g, label, min, max, step] of SPEC) {
    const L = document.createElement("label"); L.innerHTML = `${label} <span id="v_${k}"></span>`;
    const I = document.createElement("input"); I.type = "range"; I.min = min; I.max = max; I.step = step; I.id = k; I.value = P[k];
    const dec = step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
    const show = () => { document.getElementById("v_" + k).textContent = (+P[k]).toFixed(dec); dump(); };
    I.addEventListener("input", e => { P[k] = +e.target.value; show(); if (k === "spread") resetCrowd(); });
    group(g).appendChild(L); group(g).appendChild(I); show();
  }
  dump();
}
function start() {
  buildUI();
  document.getElementById("mOne").onclick = () => setMode("one");
  document.getElementById("mCrowd").onclick = () => setMode("crowd");
  document.getElementById("mPause").onclick = () => {
    paused = !paused; document.getElementById("mPause").classList.toggle("on", paused);
    if (paused && one) scrubP = one.p;
  };
  document.getElementById("scrub").addEventListener("input", e => {
    if (mode !== "one") setMode("one");
    scrubP = +e.target.value; paused = true; document.getElementById("mPause").classList.add("on");
  });
  document.getElementById("reset").onclick = () => {
    Object.assign(P, DEFAULTS);
    for (const s of SPEC) { const el = document.getElementById(s[0]); el.value = P[s[0]]; el.dispatchEvent(new Event("input")); }
  };
  document.getElementById("copy").onclick = () => {
    const t = document.getElementById("out"); t.select(); navigator.clipboard?.writeText(t.value); document.execCommand("copy");
  };
  setMode("one");
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
